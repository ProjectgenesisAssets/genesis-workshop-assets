<!doctype html><html><head><meta charset="utf-8"><script src="/playcanvas.min.js"></script></head><body><canvas id="c" width="640" height="360"></canvas><script>
const canvas=document.getElementById('c');
const app=new pc.Application(canvas,{graphicsDeviceOptions:{alpha:false,antialias:false}});
app.setCanvasFillMode(pc.FILLMODE_NONE);app.setCanvasResolution(pc.RESOLUTION_FIXED,640,360);
const camera=new pc.Entity('test-camera');camera.addComponent('camera',{clearColor:new pc.Color(.12,.12,.12),nearClip:.01,farClip:300});
camera.setPosition(2,1.8,4);camera.lookAt(0,1,0);app.root.addChild(camera);
app.start();window.__pc_app=app;window.__doorStatus=null;
</script></body></html>
