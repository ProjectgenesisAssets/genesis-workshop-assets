name: Genesis Door V011 triangle optimization with silhouette QA
on:
  workflow_dispatch:
  push:
    branches:
      - production/door-v011-triangle-budget
    paths:
      - 'scripts/puerta_herreria_art_011.py'
      - 'scripts/compare_door_geometry_v011.py'
      - '.github/workflows/door-art-v011-qa.yml'
permissions:
  contents: read
concurrency:
  group: genesis-door-v011-${{ github.ref }}
  cancel-in-progress: false
jobs:
  door_v011:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Verify V009 baseline and source syntax
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/puerta_herreria_art_011.py scripts/compare_door_geometry_v011.py
          for shot in front three_quarter side rear; do test -s "previews/door_v009/$shot.png"; done
      - name: Install official Blender 4.5.13 on GitHub runner only
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 \
            https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz \
            -o /tmp/door-blender.tar.xz
          mkdir -p /tmp/door-blender
          tar -xJf /tmp/door-blender.tar.xz -C /tmp/door-blender --strip-components=1
          /tmp/door-blender/blender --version | grep -F 'Blender 4.5.13'
          /tmp/door-blender/blender -b --python-expr 'import numpy; print(numpy.__version__)'
      - name: Render actual corrected door model and PBR with Cycles CPU
        env:
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
        run: |
          /tmp/door-blender/blender -b -t 3 --python-exit-code 1 \
            --python scripts/puerta_herreria_art_011.py
      - name: Check GLB, source master, audit, 12 PBR files and four views
        run: |
          set -euo pipefail
          out=output_blacksmith_door_art_011
          test -s "$out/Blacksmith_Door_Art_011.glb"
          test -s "$out/Blacksmith_Door_Art_011.blend"
          test -s "$out/DESIGN_AUDIT.json"
          for shot in front_orthographic three_quarter side_orthographic rear_orthographic; do
            test -s "$out/$shot.png"
          done
          python3 - <<'PY'
          from pathlib import Path
          import json,struct
          out=Path('output_blacksmith_door_art_011')
          p=out/'Blacksmith_Door_Art_011.glb'
          with p.open('rb') as f:
              magic,version,length=struct.unpack('<III',f.read(12))
          assert magic==0x46546c67 and version==2 and length==p.stat().st_size
          a=json.loads((out/'DESIGN_AUDIT.json').read_text())
          assert a['version']=='V011' and len(a['targeted_repairs'])==4
          assert a['evaluated_triangles']>0
          assert len(list(out.glob('*_albedo.png')))==4
          assert len(list(out.glob('*_roughness.png')))==4
          assert len(list(out.glob('*_normal.png')))==4
          PY
      - name: Audit exported GLB triangle count against V010
        run: |
          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          p=Path("output_blacksmith_door_art_011/Blacksmith_Door_Art_011.glb")
          with p.open("rb") as f:
              magic,version,total=struct.unpack("<III",f.read(12))
              length,typ=struct.unpack("<I4s",f.read(8))
              assert magic==0x46546c67 and version==2 and typ==b"JSON"
              doc=json.loads(f.read(length))
          triangles=0
          for mesh in doc.get("meshes",[]):
              for prim in mesh.get("primitives",[]):
                  if prim.get("mode",4)!=4:continue
                  idx=prim.get("indices")
                  n=doc["accessors"][idx]["count"] if idx is not None else doc["accessors"][prim["attributes"]["POSITION"]]["count"]
                  triangles+=n//3
          print("DOOR_V011_GLB_TRIANGLES",triangles)
          assert 10000<triangles<68028,("No exported GLB triangle improvement",triangles)
          PY
      - name: Compare V010 and V011 four-view silhouette and evaluated geometry
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          mkdir -p /tmp/door-v011-staged
          cp output_blacksmith_door_art_011/front_orthographic.png /tmp/door-v011-staged/front.png
          cp output_blacksmith_door_art_011/side_orthographic.png /tmp/door-v011-staged/side.png
          cp output_blacksmith_door_art_011/rear_orthographic.png /tmp/door-v011-staged/rear.png
          cp output_blacksmith_door_art_011/three_quarter.png /tmp/door-v011-staged/three_quarter.png
          python3 scripts/compare_door_geometry_v011.py \
            --asset door --baseline previews/door_v010 \
            --candidate /tmp/door-v011-staged \
            --baseline-version V010 --version V011 \
            --source-sha '${{ github.sha }}' --out reports/door_v011 \
            --audit output_blacksmith_door_art_011/DESIGN_AUDIT.json
          cat reports/door_v011/comparison.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve unapproved candidate and four image comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: door-v011-candidate-${{ github.run_id }}
          path: |
            output_blacksmith_door_art_011/front_orthographic.png
            output_blacksmith_door_art_011/three_quarter.png
            output_blacksmith_door_art_011/side_orthographic.png
            output_blacksmith_door_art_011/rear_orthographic.png
            output_blacksmith_door_art_011/Blacksmith_Door_Art_011.glb
            output_blacksmith_door_art_011/DESIGN_AUDIT.json
            reports/door_v011/*
          retention-days: 14
          if-no-files-found: warn
  publish_review:
    needs: door_v011
    if: ${{ needs.door_v011.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: door-v011-candidate-*
          path: /tmp/door-v011-art
          merge-multiple: true
      - name: Publish previews and comparison to isolated branch only
        run: |
          set -euo pipefail
          mkdir -p previews/door_v011 reports/door_v011
          cp /tmp/door-v011-art/output_blacksmith_door_art_011/front_orthographic.png previews/door_v011/front.png
          cp /tmp/door-v011-art/output_blacksmith_door_art_011/three_quarter.png previews/door_v011/three_quarter.png
          cp /tmp/door-v011-art/output_blacksmith_door_art_011/side_orthographic.png previews/door_v011/side.png
          cp /tmp/door-v011-art/output_blacksmith_door_art_011/rear_orthographic.png previews/door_v011/rear.png
          cp /tmp/door-v011-art/reports/door_v011/* reports/door_v011/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/door_v011 reports/door_v011
          if ! git diff --cached --quiet; then
            git commit -m 'Publish door V011 candidate renders for art review, not approved [skip ci]'
            git fetch origin '${{ github.ref_name }}'
            git rebase 'origin/${{ github.ref_name }}'
            git push origin "HEAD:${{ github.ref_name }}"
          fi
