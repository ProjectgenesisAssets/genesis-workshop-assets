name: "Genesis Herrero V007 - publish already-rendered previews and lightweight WebGL parts"
on:
  push:
    branches: [feature/blacksmith-workshop-walls-v007]
    paths:
      - .github/workflows/blacksmith-v007-publish-webgl.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: genesis-v007-publish-webgl
  cancel-in-progress: false
jobs:
  publish-v007-after-cycles:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for V007 Blender render to reach terminal state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            status=$(gh api repos/ProjectgenesisAssets/genesis-workshop-assets/actions/runs/41169438096 --jq '.status')
            echo "V007 Blender render: $status"
            if [ "$status" = completed ]; then break; fi
            sleep 15
          done
          test "$(gh api repos/ProjectgenesisAssets/genesis-workshop-assets/actions/runs/41169438096 --jq '.status')" = completed
      - name: Download Blender's actual rendered artifacts without rerunning Cycles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 41169438096 -R ProjectgenesisAssets/genesis-workshop-assets \
            -n genesis-blacksmith-workshop-v007-blend-glb-pbr-review -D /tmp/blacksmith-v007
          test -s /tmp/blacksmith-v007/output_workshop_wall_herrero_v007/AUDIT.json
          for p in left right rear front_v006; do
            test -s "/tmp/blacksmith-v007/output_workshop_wall_herrero_v007/genesis_blacksmith_wall_${p}_v007.glb"
          done
      - name: Compress ONLY texture bitmaps and validate GLB structure
        run: |
          set -euo pipefail
          python3 -m pip install --user pillow==11.3.0
          mkdir -p public/models/blacksmith-v007
          for p in left right rear front_v006; do
            python3 scripts/blacksmith_wall_preview_optimizer.py \
              "/tmp/blacksmith-v007/output_workshop_wall_herrero_v007/genesis_blacksmith_wall_${p}_v007.glb" \
              "public/models/blacksmith-v007/wall_${p}_preview.glb" 1024
          done
          python3 scripts/blacksmith_wall_preview_optimizer.py \
            /tmp/blacksmith-v007/output_workshop_wall_herrero_v007/genesis_wall_herrero_v007.glb \
            public/models/blacksmith-v007/full_workshop_preview.glb 1024
          python3 - <<'PY'
          import pathlib,json
          root=pathlib.Path('public/models/blacksmith-v007')
          sizes={p.name:p.stat().st_size for p in root.glob('*.glb')}
          assert len(sizes)==5,sizes
          assert all(sz<15000000 for sz in sizes.values()),sizes
          pathlib.Path('public/models/blacksmith-v007/WEBGL_AUDIT.json').write_text(json.dumps(
            {'status':'UNAPPROVED_RENDERED_GAME_CANDIDATE','v':'007',
             'geometry_changed_by_optimizer':False,'max_texture_edge':1024,
             'glb_bytes':sizes,'forge_and_collision':'NOT_VALIDATED'},indent=2))
          print('WEBGL_V007',sizes)
          PY
      - name: Publish six real Blender renders and audit plus small GLBs
        run: |
          set -euo pipefail
          src=/tmp/blacksmith-v007/output_workshop_wall_herrero_v007
          dest=previews/workshop_walls/herrero/full_v007
          mkdir -p "$dest"
          for p in front three_quarter right_side rear cutaway detail; do
            cp "$src/$p.png" "$dest/$p.png"
          done
          cp "$src/AUDIT.json" "$dest/AUDIT.json"
          cp /tmp/blacksmith-v007/inputs/wall_herrero_v007/PROVENANCE.json "$dest/PROVENANCE.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest" public/models/blacksmith-v007
          if ! git diff --cached --quiet; then
            git commit -m "Publish Herrero V007 four-wall Blender renders and lightweight WebGL pieces [skip ci]"
            git pull --rebase origin feature/blacksmith-workshop-walls-v007
            git push origin HEAD:feature/blacksmith-workshop-walls-v007
          fi
