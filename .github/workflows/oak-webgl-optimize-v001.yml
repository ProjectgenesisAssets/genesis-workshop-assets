name: Genesis oak WebGL LOD audit V001
on:
  workflow_dispatch:
  push:
    branches: [feature/plaza-cuatro-arboles-playcanvas]
    paths:
      - scripts/optimize_tree_webgl_v001.py
      - .github/workflows/oak-webgl-optimize-v001.yml
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download Blender 4.5.13
        run: |
          curl -fSL --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz -o /tmp/blender.tar.xz
          mkdir -p /tmp/blender
          tar -xJf /tmp/blender.tar.xz -C /tmp/blender --strip-components=1
      - name: Optimize oak without touching original
        run: |
          test -s assets/plaza_trees_v017/oak/oak_easytree_v017.glb
          /tmp/blender/blender -b -t 2 --python-exit-code 1 --python scripts/optimize_tree_webgl_v001.py -- assets/plaza_trees_v017/oak/oak_easytree_v017.glb output/oak_webgl_v001
      - name: Save experimental LODs
        run: |
          mkdir -p assets/oak_webgl_v001
          cp output/oak_webgl_v001/* assets/oak_webgl_v001/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/oak_webgl_v001
          git diff --cached --quiet || git commit -m 'Oak WebGL LOD experiment [skip ci]'
          git pull --rebase origin feature/plaza-cuatro-arboles-playcanvas
          git push origin HEAD:feature/plaza-cuatro-arboles-playcanvas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oak-webgl-v001
          path: output/oak_webgl_v001/
