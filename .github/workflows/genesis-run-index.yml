name: Genesis production run index (V009 audit)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-run-index.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record public production run IDs and conclusions for troubleshooting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evaluation
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ProjectgenesisAssets/genesis-workshop-assets/actions/workflows/genesis-six-materials.yml/runs?per_page=20" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); rows=[{"run_id":r["id"],"head_sha":r["head_sha"],"status":r["status"],"conclusion":r.get("conclusion"),"created_at":r["created_at"],"url":r["html_url"]} for r in d.get("workflow_runs",[])]; print(json.dumps(rows,indent=2))' \
            > evaluation/production-run-index.json
          cat evaluation/production-run-index.json
      - name: Publish discoverable run index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluation/production-run-index.json
          if ! git diff --cached --quiet; then
            git commit -m "diagnostics: publish production GitHub Actions run IDs [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
