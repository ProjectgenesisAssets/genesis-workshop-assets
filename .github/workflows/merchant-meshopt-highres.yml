name: Merchant meshoptimizer high-res final visual QA

on:
  push:
    branches:
      - experiment/merchant-v02-conservative-optimization-20261102
    paths:
      - .github/workflows/merchant-meshopt-highres.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  high-res:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download approved V01 source
        uses: actions/download-artifact@v4
        with:
          name: genesis-merchant-targeted-repair
          run-id: 41454954137
          repository: ProjectgenesisAssets/genesis-workshop-assets
          github-token: ${{ github.token }}
          path: input
      - name: Get verified UV-aware gltfpack candidates
        uses: actions/download-artifact@v4
        with:
          name: genesis-merchant-meshoptimizer-compare
          run-id: 41460181323
          repository: ProjectgenesisAssets/genesis-workshop-assets
          github-token: ${{ github.token }}
          path: previous
      - name: Prepare Blender and high-resolution candidates
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          python -m pip install --user pillow numpy
          mkdir -p output/inputs output/renders
          cp previous/inputs/ratio70.glb output/inputs/
          cp previous/inputs/ratio80.glb output/inputs/
          python -m py_compile tools/merchant_meshopt_render.py tools/merchant_meshopt_qa.py
      - name: Render actual GLB models in Cycles from five camera angles
        env:
          MERCHANT_SAMPLES: "42"
          MERCHANT_WIDTH: "900"
          MERCHANT_HEIGHT: "1100"
        run: |
          set -o pipefail
          blender -b -t 4 --python tools/merchant_meshopt_render.py -- input/ProjectGenesis_Mercader_Reparado_108525.glb output/inputs output/renders 2>&1 | tee output/highres_cycles_log.txt
      - name: Quantify differences and build side-by-side render boards
        run: |
          python tools/merchant_meshopt_qa.py output/renders input/ProjectGenesis_Mercader_Reparado_108525.glb
      - name: Verify kept artifacts contain compatible glTF data
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct,json
          for p in Path('output/inputs').glob('*.glb'):
              with p.open('rb') as f:
                  magic,version,size,jlen,typ=struct.unpack('<4sIIII',f.read(20))
                  assert magic==b'glTF' and version==2 and size==p.stat().st_size and typ==0x4e4f534a
                  d=json.loads(f.read(jlen))
              assert len(d['meshes'])>=1 and len(d['materials'])>=1 and len(d['textures'])>=1
              assert 'EXT_meshopt_compression' not in d.get('extensionsRequired',[])
              print('VALID',p.name,p.stat().st_size)
          PY
      - name: Upload high-res renders and both safe candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-merchant-meshopt-highres
          path: output/
          retention-days: 14
          if-no-files-found: error
