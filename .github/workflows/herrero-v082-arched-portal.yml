name: Herrero V082 arched masonry integrated with approved V013 walls
on:
  push:
    branches: [integration/herrero-v082-arched-doorway]
    paths:
      - scripts/finish_herrero_v082_arch_from_v013.py
      - .github/workflows/herrero-v082-arched-portal.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  arch:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Blender LTS
        run: |
          curl -fsSL --retry 3 --max-time 300 https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz -o /tmp/blender.tar.xz
          mkdir -p /tmp/blender
          tar -xJf /tmp/blender.tar.xz -C /tmp/blender --strip-components=1
          /tmp/blender/blender --version
      - name: Source geometry and script
        run: |
          test -s public/models/blacksmith-structural-v013/batched/blacksmith_four_walls_preview.glb
          python3 -m py_compile scripts/finish_herrero_v082_arch_from_v013.py
      - name: Rebuild only arched masonry around V082-B
        run: /tmp/blender/blender -b -t 2 --python-exit-code 1 --python scripts/finish_herrero_v082_arch_from_v013.py
      - name: Validate and publish
        run: |
          test -s public/models/blacksmith-v082-arched-portal/blacksmith_four_walls_arched_v082.glb
          test -s public/models/blacksmith-v082-arched-portal/audit.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/models/blacksmith-v082-arched-portal
          if ! git diff --cached --quiet; then
            git commit -m 'Publish V082 arched masonry fit from approved V013 [skip ci]'
            git pull --rebase origin integration/herrero-v082-arched-doorway
            git push origin HEAD:integration/herrero-v082-arched-doorway
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genesis-herrero-v082-arched-walls
          path: public/models/blacksmith-v082-arched-portal/
          retention-days: 7
