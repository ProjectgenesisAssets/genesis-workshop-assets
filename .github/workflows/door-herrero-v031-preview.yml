name: Herrero Door V031 - authentic forged iron preview
on:
  push:
    branches:
      - production/door-herrero
    paths:
      - scripts/puerta_herreria_art_031.py
      - .github/workflows/door-herrero-v031-preview.yml
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender 4.5.13 LTS
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 300 https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz -o /tmp/blender.tar.xz
          mkdir -p /tmp/blender
          tar -xJf /tmp/blender.tar.xz -C /tmp/blender --strip-components=1
          /tmp/blender/blender --version | grep -F 'Blender 4.5.13'
      - name: Render V031 multilayer wrought iron; preserve V011 geometry and approved pattern
        env:
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
        run: |
          /tmp/blender/blender -b -t 3 --python-exit-code 1 --python scripts/puerta_herreria_art_031.py
      - name: Verify source geometry and V175 maps
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('output_blacksmith_door_art_031')
          a=json.loads((p/'DESIGN_AUDIT.json').read_text())
          assert a['geometry_baseline']=='V011_USER_APPROVED' if 'geometry_baseline' in a else a['evaluated_triangles']>10000
          assert (p/'front_orthographic.png').stat().st_size>100000
          assert (p/'three_quarter.png').stat().st_size>100000
          print('V031 PREVIEW GENERATED - NOT ART APPROVED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blacksmith-v031-v175-layered-preview
          path: |
            output_blacksmith_door_art_031/*.png
            output_blacksmith_door_art_031/*.json
          retention-days: 7
      - name: Publish two preview renders to isolated door branch
        if: success()
        run: |
          mkdir -p previews/door_herrero_v031
          cp output_blacksmith_door_art_031/front_orthographic.png previews/door_herrero_v031/front.png
          cp output_blacksmith_door_art_031/three_quarter.png previews/door_herrero_v031/three_quarter.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/door_herrero_v031
          if ! git diff --cached --quiet; then
            git commit -m 'Preview blacksmith V031 forged iron [skip ci]'
            git pull --rebase origin production/door-herrero
            git push origin HEAD:production/door-herrero
          fi
