name: Genesis Roble V020 | Tronco + Tablas | HDRI32
on:
  push:
    branches: [experiment/roble-v020-tronco-tablas-hdri32]
    paths:
      - '.github/workflows/roble-v020-tronco-tablas-hdri32.yml'
      - 'tools/roble_v020_tronco_tablas_hdri32.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/roble-v020-tronco-tablas-hdri32
      - name: Restore original V019 oak source asset from completed GitHub Actions
        uses: actions/download-artifact@v4
        with:
          name: genesis-V019-dry-oak-wood-41355877171
          run-id: 41355877171
          repository: ProjectgenesisAssets/genesis-workshop-assets
          github-token: ${{ github.token }}
          path: oak_v019_source
      - name: Validate source GLB and Python script
        run: |
          set -euo pipefail
          mkdir -p input output/oak_v020
          original="$(find oak_v019_source -type f -name dry-oak-wood.glb -print -quit)"
          test -n "$original"
          cp "$original" input/dry-oak-wood.glb
          python3 - <<'PY'
          import struct,pathlib,ast
          p=pathlib.Path('input/dry-oak-wood.glb')
          assert p.stat().st_size>1000000
          with p.open('rb') as f: assert f.read(4)==b'glTF'
          ast.parse(pathlib.Path('tools/roble_v020_tronco_tablas_hdri32.py').read_text())
          print('SOURCE_V019_VALID',p.stat().st_size)
          PY
      - name: Install Blender 4.5.13 LTS and genuine HDRI 32-bit
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz -o /tmp/blender-4.5.13.tar.xz
          mkdir -p /tmp/genesis-blender-4.5.13
          tar -xJf /tmp/blender-4.5.13.tar.xz -C /tmp/genesis-blender-4.5.13 --strip-components=1
          /tmp/genesis-blender-4.5.13/blender --version | head -3
          curl -fLsS --retry 3 --connect-timeout 30 --max-time 180 https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/2k/studio_small_09_2k.hdr -o input/studio_small_09_2k.hdr
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('input/studio_small_09_2k.hdr')
          assert p.stat().st_size>250000 and b'RADIANCE' in p.read_bytes()[:32]
          print('AUTHENTIC_RADIANCE_HDRI',p.stat().st_size)
          PY
      - name: Derive oak V020 from original V019 geometry and create matching boards
        run: |
          set -o pipefail
          /tmp/genesis-blender-4.5.13/blender -b -t 4 --python-exit-code 1 --python tools/roble_v020_tronco_tablas_hdri32.py 2>&1 | tee output/oak_v020/blender_log.txt
      - name: Validate distinct GLBs, endgrain map and six actual EXR32 rendered images
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json
          p=pathlib.Path("output/oak_v020")
          r=json.loads((p/"validation.json").read_text())
          assert r["asset"]=="dry-oak-wood" and not r["approved"]
          assert r["geometry_original_unchanged"]
          assert len(r["outputs"])==2
          for obj in r["outputs"]:
              assert obj["triangles"]<30000 and obj["images"]>=2
          for stem in ("roble_tronco_3cuartos","roble_tronco_corte",
                       "roble_tronco_dorso","roble_tablas_3cuartos",
                       "roble_tablas_cantos","roble_tablas_superior"):
              png=p/"renders"/(stem+".png")
              exr=p/"renders"/(stem+".exr")
              assert png.stat().st_size>40000 and png.read_bytes()[:8]==b"\x89PNG\r\n\x1a\n"
              assert exr.stat().st_size>100000 and exr.read_bytes()[:4]==b"\x76\x2f\x31\x01"
          print("GENESIS_ROBLE_V020_QA_PASSED",json.dumps(r,ensure_ascii=False))
          PY
      - name: Keep original versions and upload candidate review; do not integrate into game
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-roble-v020-tronco-tablas-hdri32
          path: |
            output/oak_v020/
          retention-days: 14
          if-no-files-found: warn
