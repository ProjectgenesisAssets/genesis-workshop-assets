name: Genesis Door V009 reinforced rear braces and metal art QA
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/puerta_herreria_art_009.py'
      - 'scripts/compare_art_candidate.py'
      - '.github/workflows/door-art-v009-qa.yml'
permissions:
  contents: read
concurrency:
  group: genesis-door-v009-${{ github.ref }}
  cancel-in-progress: false
jobs:
  door_v009:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Verify V008 baseline and source syntax
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/puerta_herreria_art_009.py scripts/compare_art_candidate.py
          for shot in front three_quarter side rear; do test -s "previews/door_v008/$shot.png"; done
      - name: Install official Blender 4.5.13 on GitHub runner only
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 \
            https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz \
            -o /tmp/door-blender.tar.xz
          mkdir -p /tmp/door-blender
          tar -xJf /tmp/door-blender.tar.xz -C /tmp/door-blender --strip-components=1
          /tmp/door-blender/blender --version | grep -F 'Blender 4.5.13'
          /tmp/door-blender/blender -b --python-expr 'import numpy; print(numpy.__version__)'
      - name: Render actual corrected door model and PBR with Cycles CPU
        env:
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
        run: |
          /tmp/door-blender/blender -b -t 3 --python-exit-code 1 \
            --python scripts/puerta_herreria_art_009.py
      - name: Check GLB, source master, audit, 12 PBR files and four views
        run: |
          set -euo pipefail
          out=output_blacksmith_door_art_009
          test -s "$out/Blacksmith_Door_Art_009.glb"
          test -s "$out/Blacksmith_Door_Art_009.blend"
          test -s "$out/DESIGN_AUDIT.json"
          for shot in front_orthographic three_quarter side_orthographic rear_orthographic; do
            test -s "$out/$shot.png"
          done
          python3 - <<'PY'
          from pathlib import Path
          import json,struct
          out=Path('output_blacksmith_door_art_009')
          p=out/'Blacksmith_Door_Art_009.glb'
          with p.open('rb') as f:
              magic,version,length=struct.unpack('<III',f.read(12))
          assert magic==0x46546c67 and version==2 and length==p.stat().st_size
          a=json.loads((out/'DESIGN_AUDIT.json').read_text())
          assert a['version']=='V009' and len(a['targeted_repairs'])==3
          assert len(list(out.glob('*_albedo.png')))==4
          assert len(list(out.glob('*_roughness.png')))==4
          assert len(list(out.glob('*_normal.png')))==4
          PY
      - name: Compare actual V008 and V009 render pixels without fake aesthetic score
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          mkdir -p /tmp/door-v009-staged
          cp output_blacksmith_door_art_009/front_orthographic.png /tmp/door-v009-staged/front.png
          cp output_blacksmith_door_art_009/side_orthographic.png /tmp/door-v009-staged/side.png
          cp output_blacksmith_door_art_009/rear_orthographic.png /tmp/door-v009-staged/rear.png
          cp output_blacksmith_door_art_009/three_quarter.png /tmp/door-v009-staged/three_quarter.png
          python3 scripts/compare_art_candidate.py \
            --asset door --baseline previews/door_v008 \
            --candidate /tmp/door-v009-staged \
            --baseline-version V008 --version V009 \
            --source-sha '${{ github.sha }}' --out reports/door_v009
          cat reports/door_v009/comparison.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve unapproved candidate and four image comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: door-v009-candidate-${{ github.run_id }}
          path: |
            output_blacksmith_door_art_009/front_orthographic.png
            output_blacksmith_door_art_009/three_quarter.png
            output_blacksmith_door_art_009/side_orthographic.png
            output_blacksmith_door_art_009/rear_orthographic.png
            output_blacksmith_door_art_009/Blacksmith_Door_Art_009.glb
            output_blacksmith_door_art_009/DESIGN_AUDIT.json
            reports/door_v009/*
          retention-days: 2
          if-no-files-found: warn
  publish_review:
    needs: door_v009
    if: ${{ needs.door_v009.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: door-v009-candidate-*
          path: /tmp/door-v009-art
          merge-multiple: true
      - name: Publish previews and comparison to isolated branch only
        run: |
          set -euo pipefail
          mkdir -p previews/door_v009 reports/door_v009
          cp /tmp/door-v009-art/output_blacksmith_door_art_009/front_orthographic.png previews/door_v009/front.png
          cp /tmp/door-v009-art/output_blacksmith_door_art_009/three_quarter.png previews/door_v009/three_quarter.png
          cp /tmp/door-v009-art/output_blacksmith_door_art_009/side_orthographic.png previews/door_v009/side.png
          cp /tmp/door-v009-art/output_blacksmith_door_art_009/rear_orthographic.png previews/door_v009/rear.png
          cp /tmp/door-v009-art/reports/door_v009/* reports/door_v009/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/door_v009 reports/door_v009
          if ! git diff --cached --quiet; then
            git commit -m 'Publish door V009 candidate renders for art review, not approved [skip ci]'
            git fetch origin '${{ github.ref_name }}'
            git rebase 'origin/${{ github.ref_name }}'
            git push origin "HEAD:${{ github.ref_name }}"
          fi
