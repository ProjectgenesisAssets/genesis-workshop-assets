name: Project Genesis merchant selective defect repair

on:
  push:
    branches:
      - experiment/merchant-cleanup-20261102
    paths:
      - .github/workflows/merchant-selective-repair.yml
      - tools/merchant_targeted_repair.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  targeted-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Get clean conservative 108652 triangle mesh
        uses: actions/download-artifact@v4
        with:
          name: merchant-repair-conservative-cycles
          run-id: 41446848759
          repository: ProjectgenesisAssets/genesis-workshop-assets
          github-token: ${{ github.token }}
          path: input
      - name: Prepare Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          python -m pip install --user numpy pillow
          mkdir -p output
          ls -lh input/r50/ProjectGenesis_Mercader_Optimizado.glb
      - name: Remove isolated floating waist fragments, no other mesh changes
        run: |
          set -o pipefail
          blender -b -t 4 --python tools/merchant_targeted_repair.py -- input/r50/ProjectGenesis_Mercader_Optimizado.glb output 2>&1 | tee output/repair_blender_log.txt
      - name: Validate GLB and make identical-frame before/after quality board
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,struct
          p=Path("output/ProjectGenesis_Mercader_Reparado_108525.glb")
          with p.open("rb") as f:
            magic,ver,size,jsonlen,kind=struct.unpack("<4sIIII",f.read(20))
            assert magic==b"glTF" and ver==2 and size==p.stat().st_size and kind==0x4e4f534a
            data=json.loads(f.read(jsonlen))
          assert data.get("meshes") and data.get("materials") and data.get("textures")
          print("VALID_GLTF",size,len(data["meshes"]),len(data["materials"]),len(data["textures"]))
          PY
          python -m pip install --user pillow numpy
          python - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          from numpy import asarray,mean,abs as nabs
          import json
          out=Path("output")
          refs=[]
          for angle in (0,45,90):
            a=Image.open(out/f"merchant_before_{angle}.png").convert("RGBA")
            b=Image.open(out/f"merchant_repaired_{angle}.png").convert("RGBA")
            import numpy as np
            A=np.asarray(a,dtype=np.int16);B=np.asarray(b,dtype=np.int16)
            count=np.count_nonzero(np.any(A!=B,axis=2))
            refs.append({"angle":angle,"changed_pixels":int(count),
                         "changed_percent":float(100*count/(A.shape[0]*A.shape[1]))})
          (out/"image_comparison_metrics.json").write_text(json.dumps(refs,indent=2))
          board=Image.new("RGB",(880*2,1040*2+60),(33,39,50))
          draw=ImageDraw.Draw(board)
          for row,angle in enumerate((0,45)):
            for col,key in enumerate(("before","repaired")):
              im=Image.open(out/f"merchant_{key}_{angle}.png").convert("RGBA")
              bg=Image.new("RGBA",im.size,(33,39,50,255))
              bg.alpha_composite(im)
              board.paste(bg.convert("RGB"),(880*col,1040*row+30))
              draw.text((880*col+20,1040*row+10),f"{key.upper()}  {angle} degrees",fill="white")
          board.save(out/"merchant_before_after_real_cycles.jpg",quality=95)
          print(json.dumps(refs,indent=2))
          PY
      - name: Save GLB, render, comparison and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-merchant-targeted-repair
          path: output/
          retention-days: 14
          if-no-files-found: error
