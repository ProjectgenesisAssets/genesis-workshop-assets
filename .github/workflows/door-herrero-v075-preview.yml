name: Herrero Door V075 - Dark forge-scale steel and isolated metallic edge wear
on:
  push:
    branches:
      - production/door-herrero
    paths:
      - scripts/puerta_herreria_art_075.py
      - .github/workflows/door-herrero-v075-preview.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Confirm original unpacked 4K PBR source stays unchanged
        run: |
          set -euo pipefail
          p=assets/door_herrero/materials/rusted_scratched_iron_4k
          for layer in color normalgl roughness metalness displacement; do
            test -s "$p/rusted-scratched-iron_4k_${layer}.jpg"
          done
          test -s "$p/LICENSE.txt"
      - name: Install Blender 4.5.13 LTS
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 300 https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz -o /tmp/blender.tar.xz
          mkdir -p /tmp/blender
          tar -xJf /tmp/blender.tar.xz -C /tmp/blender --strip-components=1
          /tmp/blender/blender --version | grep -F 'Blender 4.5.13'
      - name: Download neutral studio HDRI
        run: |
          curl -fsSL --retry 4 --max-time 300 https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_09_1k.hdr -o studio_small_09_1k.hdr
          test -s studio_small_09_1k.hdr
      - name: Validate Python scene code before expensive Blender render
        run: |
          python3 -m py_compile scripts/puerta_herreria_art_075.py
      - name: Blender V075 verify dark forge-scale steel in studio without silver-white washout
        env:
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
        run: |
          /tmp/blender/blender -b -t 3 --python-exit-code 1 --python scripts/puerta_herreria_art_075.py
      - name: Verify rendered comparisons
        run: |
          set -euo pipefail
          for variant in A_v073B_curtidor_rescued_reference B_blackened_forged_iron C_warm_tempered_forged_iron D_blackened_iron_closeup; do
            test -s "output_blacksmith_door_art_075/${variant}.png"
          done
          test -s output_blacksmith_door_art_075/DESIGN_AUDIT.json
          test -s output_blacksmith_door_art_075/V075_PBR_QA.json
          test -s output_blacksmith_door_art_075/V075_METAL_VS_LEATHER_QA.json
          for map in V075_normal_opengl V075_B_blackened_forged_iron_albedo V075_B_blackened_forged_iron_metalness V075_B_blackened_forged_iron_roughness V075_C_warm_tempered_forged_iron_albedo V075_C_warm_tempered_forged_iron_metalness V075_C_warm_tempered_forged_iron_roughness; do
            test -s "output_blacksmith_door_art_075/${map}.png"
          done
          sha256sum output_blacksmith_door_art_075/{A_v073B_curtidor_rescued_reference,B_blackened_forged_iron,C_warm_tempered_forged_iron,D_blackened_iron_closeup}.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blacksmith-door-v075-matte-forge-scale-metal
          path: |
            output_blacksmith_door_art_075/*.png
            output_blacksmith_door_art_075/*.json
          retention-days: 7
      - name: Publish preview renders
        if: success()
        run: |
          set -euo pipefail
          mkdir -p previews/door_herrero_v075
          for variant in A_v073B_curtidor_rescued_reference B_blackened_forged_iron C_warm_tempered_forged_iron D_blackened_iron_closeup; do
            cp "output_blacksmith_door_art_075/${variant}.png" "previews/door_herrero_v075/${variant}.png"
          done
          cp output_blacksmith_door_art_075/B_blackened_forged_iron.png previews/door_herrero_v075/three_quarter.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/door_herrero_v075
          if ! git diff --cached --quiet; then
            git commit -m 'Publish V075 physically oxidized forged iron previews [skip ci]'
            git pull --rebase origin production/door-herrero
            git push origin HEAD:production/door-herrero
          fi
