name: Genesis Arcanist V021 - cyan glow in V018 PBR texture
on:
  push:
    branches: [production/door-v021-arcanist-cyan-texture-glow]
    paths:
      - scripts/puerta_arcanista_cyan_glow_v021.py
      - .github/workflows/door-arcanist-cyan-glow-v021.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: genesis-door-v021-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PG_DOOR_TRADE: arcanista
      PG_PBR_RES: '2048'
      PG_ARCANE_EMISSIVE_STRENGTH: '3.8'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Check approved V018 base and source syntax
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/puerta_arcanista_cyan_glow_v021.py
          test -s previews/door_v014/front.png
          test -s previews/door_v018_pbr/arcanista_hero_v018.jpg
          if grep -Fq 'ArcanePulse_' scripts/puerta_arcanista_cyan_glow_v021.py; then exit 1; fi
      - name: Install official Blender 4.5.13
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 240 https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz -o /tmp/door-v021-blender.tar.xz
          mkdir -p /tmp/door-v021-blender
          tar -xJf /tmp/door-v021-blender.tar.xz -C /tmp/door-v021-blender --strip-components=1
          /tmp/door-v021-blender/blender --version | grep -F 'Blender 4.5.13'
      - name: Render V021 cyan glow in material with four Cycles views
        run: |
          set -euo pipefail
          /tmp/door-v021-blender/blender -b -t 3 --python-exit-code 1 --python scripts/puerta_arcanista_cyan_glow_v021.py
      - name: Audit texture emissive strength, GLB and silhouette
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          from PIL import Image,ImageChops,ImageStat
          p=Path("output_workshop_door_v021_arcanista")
          for kind in ("albedo","roughness","normal","metallic"):
              assert len(list(p.glob("*_"+kind+".png")))==4,kind
          emission=list(p.glob("*_emission.png"))
          assert len(emission)==3,emission
          for filename in emission:
              with Image.open(filename) as im:
                  assert im.size==(2048,2048),filename
                  avg=ImageStat.Stat(im.convert("RGB").resize((256,256))).mean
                  assert avg[2]>.10*255,(filename,avg)
                  print("GLOW_BAKED_CYAN_EMISSIVE",filename.name,avg)
          audit=json.loads((p/"V021_MATERIAL_TEST.json").read_text())
          assert audit["version"]=="V021" and audit["profession"]=="arcanista"
          assert audit["geometry_baseline"]=="V011_USER_APPROVED"
          glb=p/"Workshop_Door_V021_arcanista.glb"
          with glb.open("rb") as f:magic,version,size=struct.unpack("<III",f.read(12))
          assert (magic,version,size)==(0x46546c67,2,glb.stat().st_size)
          for a,b in {"front":"front_orthographic","three_quarter":"three_quarter","rear":"rear_orthographic","side":"side_orthographic"}.items():
              with Image.open("previews/door_v014/"+a+".png") as reference,Image.open(p/(b+".png")) as new:
                  aa=reference.getchannel("A").point(lambda v:255 if v>127 else 0)
                  bb=new.getchannel("A").point(lambda v:255 if v>127 else 0)
                  iou=sum(ImageChops.darker(aa,bb).histogram()[128:])/max(1,sum(ImageChops.lighter(aa,bb).histogram()[128:]))
                  print("V021_LOCKED_SILHOUETTE",a,iou)
                  assert iou>=(.99 if a=="side" else .994),(a,iou)
          print("REAL_GLOW_PBR_MATERIAL_EXPORT_VALID",glb.stat().st_size)
          PY
      - name: Retain actual V021 3D, PBR emission maps and renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: door-v021-arcanist-cyan-emissive
          path: |
            output_workshop_door_v021_arcanista/*.png
            output_workshop_door_v021_arcanista/*.glb
            output_workshop_door_v021_arcanista/*.blend
            output_workshop_door_v021_arcanista/*.json
          retention-days: 14
          if-no-files-found: warn
  gallery:
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: door-v021-arcanist-cyan-emissive
          path: evidence
      - name: Publish V018 versus V021 authentic Blender views
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          folder=Path("previews/door_v021_cyan_glow")
          folder.mkdir(parents=True,exist_ok=True)
          files=list(Path("evidence").rglob("three_quarter.png"))
          assert len(files)==1,files
          p=files[0].parent
          views=("front_orthographic","three_quarter","side_orthographic","rear_orthographic")
          sheet=Image.new("RGB",(1600,2100),(28,30,35))
          for i,view in enumerate(views):
              file=p/(view+".png")
              assert file.stat().st_size>10000,file
              with Image.open(file) as im:
                  img=im.convert("RGBA")
                  img.thumbnail((710,955),Image.Resampling.LANCZOS)
                  tile=Image.new("RGBA",(800,1050),(34,37,42,255))
                  tile.alpha_composite(img,((800-img.width)//2,36+(955-img.height)//2))
                  final=tile.convert("RGB")
              ImageDraw.Draw(final).text((18,1010),"Arcanista V021 glow texture - "+view,fill=(233,241,248))
              sheet.paste(final,((i%2)*800,(i//2)*1050))
              if i==1: final.save(folder/"arcanista_glow_hero_v021.jpg",quality=90,optimize=True)
          sheet.save(folder/"four_views_v021.jpg",quality=88,optimize=True)
          old=Image.open("previews/door_v018_pbr/arcanista_hero_v018.jpg").convert("RGB")
          new=Image.open(folder/"arcanista_glow_hero_v021.jpg").convert("RGB")
          comp=Image.new("RGB",(1600,1050),(30,32,36))
          old.thumbnail((750,990),Image.Resampling.LANCZOS)
          comp.paste(old,((800-old.width)//2,25))
          comp.paste(new,(800,0))
          draw=ImageDraw.Draw(comp)
          draw.text((180,1010),"V018 - sin glow fuerte",fill=(232,230,219))
          draw.text((960,1010),"V021 - glow celeste en PBR",fill=(229,242,249))
          comp.save(folder/"v018_vs_v021.jpg",quality=89,optimize=True)
          print("REAL_RENDER_REVIEW",[(x.name,x.stat().st_size) for x in folder.glob("*.jpg")])
          PY
      - name: Commit V021 previews only to candidate branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/door_v021_cyan_glow
          if ! git diff --cached --quiet; then
            git commit -m 'V021 real Cycles preview: strong cyan emissive embedded in V018 door [skip ci]'
            git fetch origin production/door-v021-arcanist-cyan-texture-glow
            git rebase origin/production/door-v021-arcanist-cyan-texture-glow
            git push origin HEAD:production/door-v021-arcanist-cyan-texture-glow
          fi
