name: Merchant V02 safest Blender polygon reduction

on:
  push:
    branches:
      - experiment/merchant-v02-conservative-optimization-20261102
    paths:
      - .github/workflows/merchant-v02-quality.yml
      - tools/merchant_v02_conservative.py
      - tools/merchant_v02_quality.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  merchant-v02:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Get approved repaired 108525-triangle V01 from prior verified run
        uses: actions/download-artifact@v4
        with:
          name: genesis-merchant-targeted-repair
          run-id: 41454954137
          repository: ProjectgenesisAssets/genesis-workshop-assets
          github-token: ${{ github.token }}
          path: input
      - name: Install Blender and Python QA dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          python -m pip install --user numpy pillow
          python -m py_compile tools/merchant_v02_conservative.py tools/merchant_v02_quality.py
          mkdir -p output
          ls -lh input/ProjectGenesis_Mercader_Reparado_108525.glb
          blender --version
      - name: Make new conservative candidate meshes and 5-view Cycles previews
        run: |
          set -o pipefail
          blender -b -t 4 --python tools/merchant_v02_conservative.py -- candidates input/ProjectGenesis_Mercader_Reparado_108525.glb output 2>&1 | tee output/candidate_blender_log.txt
      - name: Reject local holes and select lightest safe candidate
        run: |
          python tools/merchant_v02_quality.py candidates output | tee output/candidate_qa_log.txt
          python - <<'PY'
          import json
          x=json.load(open("output/selected.json"))
          assert x["passed"], "No candidates passed; retain V01 unchanged"
          print("CANDIDATE_CHOSEN",x["ratio"],x["triangles"])
          PY
      - name: Export selected GLB with original texture and render high-resolution Cycles
        run: |
          set -o pipefail
          blender -b -t 4 --python tools/merchant_v02_conservative.py -- final input/ProjectGenesis_Mercader_Reparado_108525.glb output 2>&1 | tee output/final_blender_log.txt
      - name: Confirm high resolution view-by-view and local quality
        run: |
          set -o pipefail
          python tools/merchant_v02_quality.py final output 2>&1 | tee output/final_qa_log.txt
      - name: Verify GLB container, PBR and mesh properties
        run: |
          python - <<'PY'
          import json,struct
          from pathlib import Path
          fn=Path('output/ProjectGenesis_Mercader_V02_Candidato.glb')
          assert fn.exists()
          with fn.open('rb') as f:
              magic,version,size,n,typ=struct.unpack('<4sIIII',f.read(20))
              assert magic==b'glTF' and version==2 and size==fn.stat().st_size and typ==0x4e4f534a
              payload=json.loads(f.read(n))
          assert payload.get('meshes') and payload.get('textures') and payload.get('images') and payload.get('materials')
          assert not payload.get('skins') and not payload.get('animations')
          qa=json.load(open('output/final_quality_report.json'))
          assert qa["highres_all_passed"]
          summary={'glb_bytes':fn.stat().st_size,
                   'meshes':len(payload['meshes']),
                   'materials':len(payload['materials']),
                   'images':len(payload['images']),
                   'textures':len(payload['textures']),
                   'candidate_tris':qa["triangles"],
                   'original_tris':qa["source_triangles"],
                   'reduction_pct':qa['reduction_pct'],
                   'highres_all_passed':qa['highres_all_passed']}
          Path('output/validation_summary.json').write_text(json.dumps(summary,indent=2))
          print("APPROVED_BY_AUTOMATED_QA",json.dumps(summary))
          PY
      - name: Retain original comparison and diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-merchant-v02-optimization-qa
          path: output/
          retention-days: 14
          if-no-files-found: error
