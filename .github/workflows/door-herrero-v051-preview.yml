name: Herrero Door V051 - Meshy rusted scratched iron original 4K PBR
on:
  push:
    branches:
      - production/door-herrero
    paths:
      - scripts/puerta_herreria_art_051.py
      - .github/workflows/door-herrero-v051-preview.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Download original CC0 4K material and unpack independent PBR maps
        run: |
          set -euo pipefail
          mkdir -p assets/door_herrero/materials/rusted_scratched_iron_4k
          curl -fL --retry 4 --retry-delay 4 --max-time 360 \
            https://cdn.meshy.ai/landing-assets/textures/metal/rusted-scratched-iron/rusted-scratched-iron-pbr-4k.zip \
            -o /tmp/rusted_scratched_iron_4k.zip
          unzip -t /tmp/rusted_scratched_iron_4k.zip
          unzip -o -j /tmp/rusted_scratched_iron_4k.zip \
            -d assets/door_herrero/materials/rusted_scratched_iron_4k
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/door_herrero/materials/rusted_scratched_iron_4k')
          for name in ('color','normalgl','roughness','metalness','displacement'):
              f=p/('rusted-scratched-iron_4k_'+name+'.jpg')
              assert f.exists() and f.stat().st_size>10000,f
          assert (p/'LICENSE.txt').exists()
          print('Five source maps present; Blender validates exact 4096x4096 dimensions')
          PY
      - name: Commit unpacked source PBR and license (no ZIP)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/door_herrero/materials/rusted_scratched_iron_4k
          if ! git diff --cached --quiet; then
            git commit -m 'Store unpacked Meshy ambientCG CC0 original 4K PBR maps [skip ci]'
            git pull --rebase origin production/door-herrero
            git push origin HEAD:production/door-herrero
          fi
      - name: Install Blender 4.5.13 LTS
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 300 https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz -o /tmp/blender.tar.xz
          mkdir -p /tmp/blender
          tar -xJf /tmp/blender.tar.xz -C /tmp/blender --strip-components=1
          /tmp/blender/blender --version | grep -F 'Blender 4.5.13'
      - name: Download neutral studio HDRI
        run: |
          curl -fsSL --retry 4 --max-time 300 https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_09_1k.hdr -o studio_small_09_1k.hdr
          test -s studio_small_09_1k.hdr
      - name: Blender V051 render real original PBR on untouched V011 mesh
        env:
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
        run: |
          /tmp/blender/blender -b -t 3 --python-exit-code 1 --python scripts/puerta_herreria_art_051.py
      - name: Verify rendered comparisons
        run: |
          set -euo pipefail
          test -s output_blacksmith_door_art_051/front_orthographic.png
          test -s output_blacksmith_door_art_051/three_quarter.png
          test -s output_blacksmith_door_art_051/material_closeup.png
          test -s output_blacksmith_door_art_051/material_no_normal.png
          test -s output_blacksmith_door_art_051/DESIGN_AUDIT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blacksmith-door-v051-real-CC0-material
          path: |
            output_blacksmith_door_art_051/*.png
            output_blacksmith_door_art_051/*.json
          retention-days: 7
      - name: Publish preview renders
        if: success()
        run: |
          set -euo pipefail
          mkdir -p previews/door_herrero_v051
          cp output_blacksmith_door_art_051/front_orthographic.png previews/door_herrero_v051/front.png
          cp output_blacksmith_door_art_051/three_quarter.png previews/door_herrero_v051/three_quarter.png
          cp output_blacksmith_door_art_051/material_closeup.png previews/door_herrero_v051/material_closeup.png
          cp output_blacksmith_door_art_051/material_no_normal.png previews/door_herrero_v051/material_no_normal.png
          git add previews/door_herrero_v051
          if ! git diff --cached --quiet; then
            git commit -m 'Publish V051 original CC0 iron material render [skip ci]'
            git pull --rebase origin production/door-herrero
            git push origin HEAD:production/door-herrero
          fi
