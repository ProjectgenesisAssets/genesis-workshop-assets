name: Genesis | best current fiber candidates art board
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-best-fibers-review.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install image review tooling
        run: sudo apt-get update && sudo apt-get install -y python3-pil
      - name: Collect authentic final evaluation views and GLB reports
        run: |
          git fetch --depth 1 origin '+refs/heads/asset/hemp-cord:refs/remotes/origin/asset/hemp-cord' '+refs/heads/asset/linen-thread:refs/remotes/origin/asset/linen-thread' --quiet
          mkdir -p evaluation/fibers/selected/raw
          git show origin/asset/hemp-cord:evaluation/hemp-cord/v017/three_quarter.jpg > evaluation/fibers/selected/raw/hemp.jpg
          git show origin/asset/linen-thread:evaluation/linen-thread/v018/three_quarter.jpg > evaluation/fibers/selected/raw/linen.jpg
          git show origin/asset/hemp-cord:evaluation/hemp-cord/v017/validation.json > evaluation/fibers/selected/raw/hemp.json
          git show origin/asset/linen-thread:evaluation/linen-thread/v018/validation.json > evaluation/fibers/selected/raw/linen.json
      - name: Generate objective artwork comparison
        run: |
          python3 - <<'PY'
          import json,pathlib
          from PIL import Image,ImageDraw,ImageFont
          root=pathlib.Path("evaluation/fibers/selected")
          images=[("hemp","Cordel de cáñamo"),("linen","Hilo de lino")]
          board=Image.new("RGB",(1540,875),(26,28,33))
          d=ImageDraw.Draw(board)
          try:
              big=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",28)
              small=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",17)
          except: big=ImageFont.load_default();small=big
          report=[]
          for i,(slug,name) in enumerate(images):
              pic=Image.open(root/"raw"/(slug+".jpg")).convert("RGB")
              pic.thumbnail((746,747))
              x=10+i*770
              board.paste(pic,(x+(746-pic.width)//2,10))
              j=json.loads((root/"raw"/(slug+".json")).read_text())
              assert j["quality_approved"] is False
              report.append(j)
              d.text((x+15,768),name+" — "+j["version"].split("_")[0],fill=(241,229,208),font=big)
              d.text((x+15,812),f'{j["glb_bytes"]/1e6:.2f} MB · {j["triangles_mesh"]:,} tris · pendiente de aprobación',fill=(173,178,184),font=small)
          board.save(root/"hemp_v017_linen_v018.jpg",quality=93,subsampling=0)
          (root/"technical.json").write_text(json.dumps(report,indent=2))
          PY
          rm -rf evaluation/fibers/selected/raw
      - name: Publish selected candidate board without admitting assets into game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluation/fibers/selected
          git commit -m "review: select authentic hemp V017 and linen V018 for 8/10 visual inspection [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genesis-current-hemp-and-linen-art-review
          path: evaluation/fibers/selected/
          if-no-files-found: warn
