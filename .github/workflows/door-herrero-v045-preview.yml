name: Herrero Door V045 - 4K door-specific PBR corrected Non-Color normals and roughness
on:
  push:
    branches:
      - production/door-herrero
    paths:
      - scripts/puerta_herreria_art_045.py
      - .github/workflows/door-herrero-v045-preview.yml
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender 4.5.13 LTS
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 300 https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz -o /tmp/blender.tar.xz
          mkdir -p /tmp/blender
          tar -xJf /tmp/blender.tar.xz -C /tmp/blender --strip-components=1
          /tmp/blender/blender --version | grep -F 'Blender 4.5.13'
      - name: Download neutral Poly Haven HDRI for truthful metallic reflections
        run: |
          curl -fsSL --retry 4 --retry-delay 3 --max-time 300 https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_09_1k.hdr -o studio_small_09_1k.hdr
          test -s studio_small_09_1k.hdr
      - name: Render V045 independent door-specific PBR 4K normal roughness albedo metallic
        env:
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
        run: |
          /tmp/blender/blender -b -t 3 --python-exit-code 1 --python scripts/puerta_herreria_art_045.py
      - name: Verify source geometry and 4K independently generated plate PBR
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('output_blacksmith_door_art_045')
          a=json.loads((p/'DESIGN_AUDIT.json').read_text())
          assert a['geometry_baseline']=='V011_USER_APPROVED' if 'geometry_baseline' in a else a['evaluated_triangles']>10000
          assert (p/'front_orthographic.png').stat().st_size>100000
          assert (p/'three_quarter.png').stat().st_size>100000
          from struct import unpack
          for map_name in ('normal','roughness','albedo','metallic'):
            q=p/('door_v045_4k_'+map_name+'.png')
            with q.open('rb') as f: hdr=f.read(24)
            assert hdr[:8]==b'\x89PNG\r\n\x1a\n',map_name
            assert unpack('>II',hdr[16:24])==(4096,4096),(map_name,unpack('>II',hdr[16:24]))
          print('4 x 4096 square native plate PBR maps confirmed')
          print('V045 PREVIEW GENERATED - NOT ART APPROVED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blacksmith-v045-native-4k-maps-preview
          path: |
            output_blacksmith_door_art_045/*.png
            output_blacksmith_door_art_045/*.json
          retention-days: 7
      - name: Publish two preview renders to isolated door branch
        if: success()
        run: |
          mkdir -p previews/door_herrero_v045
          cp output_blacksmith_door_art_045/front_orthographic.png previews/door_herrero_v045/front.png
          cp output_blacksmith_door_art_045/three_quarter.png previews/door_herrero_v045/three_quarter.png
          cp output_blacksmith_door_art_045/material_closeup.png previews/door_herrero_v045/material_closeup.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/door_herrero_v045
          if ! git diff --cached --quiet; then
            git commit -m 'Preview blacksmith V045 forged iron [skip ci]'
            git pull --rebase origin production/door-herrero
            git push origin HEAD:production/door-herrero
          fi
