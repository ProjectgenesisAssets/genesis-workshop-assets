name: "Genesis Herrero V011 roof - WebGL export, geometry audit and Blender reviews"
on:
  push:
    branches: [feature/blacksmith-workshop-roof-v011]
    paths:
      - .github/workflows/blacksmith-roof-v011-publish.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: genesis-herrero-roof-v011-publish
  cancel-in-progress: false
jobs:
  deliver-roof-and-reviews:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require real V011 Blender model and render success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            status=$(gh api repos/ProjectgenesisAssets/genesis-workshop-assets/actions/runs/41172505108 --jq '.status')
            echo "V011 actual Blender render status: $status"
            if [ "$status" = completed ]; then break; fi
            sleep 12
          done
          test "$(gh api repos/ProjectgenesisAssets/genesis-workshop-assets/actions/runs/41172505108 --jq '.conclusion')" = success
          gh run download 41172505108 -R ProjectgenesisAssets/genesis-workshop-assets \
            -n genesis-blacksmith-roof-v011-blend-glb-pbr-review \
            -D /tmp/herrero-roof-v011
          test -s /tmp/herrero-roof-v011/output_workshop_wall_herrero_v011/AUDIT.json
      - name: Transcode CC0 scanned PBR bitmaps without changing roof geometry
        run: |
          set -euo pipefail
          python3 -m pip install --user pillow==11.3.0
          src=/tmp/herrero-roof-v011/output_workshop_wall_herrero_v011
          dest=public/models/blacksmith-roof-v011
          mkdir -p "$dest"
          for p in roof chimney_candidate roof_and_chimney; do
            test -s "$src/genesis_blacksmith_${p}_v011.glb"
            python3 scripts/blacksmith_wall_preview_optimizer.py \
              "$src/genesis_blacksmith_${p}_v011.glb" "$dest/blacksmith_${p}_preview.glb" 1024
          done
          python3 scripts/blacksmith_wall_preview_optimizer.py \
            "$src/genesis_wall_herrero_v011.glb" "$dest/complete_blacksmith_preview.glb" 1024
      - name: Check portable GLB headers and independent roof/chimney pieces
        run: |
          python3 - <<'PY'
          import pathlib,json,struct
          root=pathlib.Path("public/models/blacksmith-roof-v011")
          files={p.name:p.stat().st_size for p in root.glob("*.glb")}
          assert len(files)==4,files
          for p in root.glob("*.glb"):
            data=p.read_bytes()
            assert data[:4]==b"glTF"
            assert struct.unpack_from("<I",data,8)[0]==len(data)
            assert len(data)<18000000,(p.name,len(data))
          audit=json.loads(pathlib.Path("/tmp/herrero-roof-v011/output_workshop_wall_herrero_v011/AUDIT.json").read_text())
          assert audit["roof_independent_meshes"]>100
          assert audit["chimney_independent_meshes"]>=7
          assert audit["roof_status"]=="MODELED_SEPARATE_DETACHABLE_GLBS_UNAPPROVED"
          report={"status":"UNAPPROVED_BUT_VERIFIED_GLB",
                  "roof_materials":"Original scanned CC0 PBR maps, resized to 1024px",
                  "roof_files":files,"roof_chimney_detachable":True,
                  "roof_functional_connection":"PENDING_GAME_VALIDATION",
                  "roof_alignment":"PENDING_PLAYCANVAS_TEST"}
          (root/"PREVIEW_AUDIT.json").write_text(json.dumps(report,indent=2))
          print(json.dumps(report))
          PY
      - name: Publish roof PNGs + GLBs to isolated experimental branch
        run: |
          set -euo pipefail
          dest=previews/workshop_walls/herrero/roof_v011
          src=/tmp/herrero-roof-v011/output_workshop_wall_herrero_v011
          mkdir -p "$dest"
          for view in front three_quarter roof_above gable right_side rear inside_no_roof chimney_detail; do
            cp "$src/$view.png" "$dest/$view.png"
          done
          cp "$src/AUDIT.json" "$dest/AUDIT.json"
          cp /tmp/herrero-roof-v011/inputs/wall_herrero_v011/PROVENANCE.json "$dest/PROVENANCE.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest" public/models/blacksmith-roof-v011
          if ! git diff --cached --quiet; then
            git commit -m "Publish Herrero V011 PBR roof, chimney and eight true Blender views [skip ci]"
            git pull --rebase origin feature/blacksmith-workshop-roof-v011
            git push origin HEAD:feature/blacksmith-workshop-roof-v011
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genesis-herrero-roof-v011-webgl-review
          path: |
            public/models/blacksmith-roof-v011/
            previews/workshop_walls/herrero/roof_v011/
          retention-days: 7
