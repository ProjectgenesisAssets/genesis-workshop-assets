name: Genesis ten-minute correction executor
on:
  push:
    paths:
      - '.github/workflows/overnight-10min-watch.yml'
      - 'scripts/production_cycle.py'
      - 'production/correction_queue.json'
  schedule:
    - cron: '*/10 2-11 27 10 *'  # 23:00-08:50 Argentina; only 27 Oct UTC
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: genesis-production-cycle
  cancel-in-progress: false
jobs:
  execute-reviewed-corrections:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Restrict overnight execution through 09:00 Argentina, 27 October
        id: window
        shell: bash
        run: |
          set -euo pipefail
          now="$(date -u +%s)"
          cutoff="$(date -u -d '2026-10-27 12:00:00' +%s)"
          final_tick="$(date -u -d '2026-10-27 11:50:00' +%s)"
          if [[ "${{ github.event_name }}" == "schedule" ]] && (( now >= final_tick )); then
            echo "final=true" >> "$GITHUB_OUTPUT"
          else
            echo "final=false" >> "$GITHUB_OUTPUT"
          fi
          if (( now <= cutoff )); then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Overnight production window closed." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run actual queued generator corrections and dispatch per asset
        if: steps.window.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/production_cycle.py
          python3 scripts/production_cycle.py
          cat reports/production_cycle.json >> "$GITHUB_STEP_SUMMARY"
      - name: Persist cycle execution receipt
        if: steps.window.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: genesis-cycle-${{ github.run_id }}
          path: reports/production_cycle.json
          retention-days: 1
          if-no-files-found: warn
      - name: Disable this overnight workflow after final 08:50 ART production tick
        if: always() && steps.window.outputs.final == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow disable overnight-10min-watch.yml --repo "${{ github.repository }}"
          echo "Night correction executor disabled at the authorized deadline." >> "$GITHUB_STEP_SUMMARY"
