name: Genesis isolated asset correction build - real Blender 4.5.13
on:
  push:
    branches:
      - 'production/auto-*'
    paths:
      - '.github/workflows/production-asset-iteration.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write  # explicitly dispatch the evidence handoff after a real Blender build
concurrency:
  group: genesis-auto-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Enforce hard 09:00 Argentina production deadline
        id: deadline
        shell: bash
        run: |
          now="$(date -u +%s)"
          cutoff="$(date -u -d '2026-10-27 12:00:00' +%s)"
          if (( now < cutoff )); then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No asset production after 09:00 ART." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Validate queued correction and source generator
        if: steps.deadline.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          ref=os.environ["GITHUB_REF_NAME"]
          m=re.fullmatch(r"production/auto-(door|anvil|forge|bellows)-([a-z][a-z0-9-]{3,70})",ref)
          assert m,("Unexpected candidate branch",ref)
          asset,task=m.groups()
          receipt=Path("production/receipts")/f"{asset}-{task}.json"
          d=json.loads(receipt.read_text())
          assert d["asset"]==asset and d["id"]==task
          aliases={"door":("puerta",),"anvil":("yunque",),"forge":("forge","hero_assets"),"bellows":("bellows",)}
          scripts=[p for p in d["edits"] if any(token in Path(p).name.lower() for token in aliases[asset])]
          assert scripts,("Generator script not in exact correction",d)
          script=scripts[0]
          assert Path(script).is_file() and script.startswith("scripts/") and script.endswith(".py")
          with open(os.environ["GITHUB_ENV"],"a") as f:
            f.write(f"ASSET={asset}\nTASK_ID={task}\nGENERATOR={script}\n")
          import py_compile
          py_compile.compile(script,doraise=True)
          print("GENESIS_REAL_CORRECTION",asset,task,script,d["reason"])
          PY
          python3 -m py_compile scripts/production_asset_qa.py
      - name: Install official Blender 4.5.13 LTS on GitHub only
        if: steps.deadline.outputs.run == 'true'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz -o /tmp/blender.tar.xz
          mkdir -p /tmp/blender
          tar -xJf /tmp/blender.tar.xz -C /tmp/blender --strip-components=1
          /tmp/blender/blender --version | grep -F 'Blender 4.5.13'
      - name: Rebuild modified generator and four real Cycles views
        if: steps.deadline.outputs.run == 'true'
        env:
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '2026-10-27 12:00:00' +%s)"
          remaining=$((cutoff-$(date -u +%s)))
          if (( remaining < 60 )); then echo "Deadline reached; skip Blender." >&2; exit 1; fi
          if [[ "$ASSET" == "bellows" || "$ASSET" == "forge" ]]; then
            timeout --signal=TERM --kill-after=5s "${remaining}s" /tmp/blender/blender -b -t 3 --python-exit-code 1 --python "$GENERATOR" -- "$ASSET"
          else
            timeout --signal=TERM --kill-after=5s "${remaining}s" /tmp/blender/blender -b -t 3 --python-exit-code 1 --python "$GENERATOR"
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          dirs=[p for p in Path(".").glob("output*") if p.is_dir() and list(p.glob("*.glb"))]
          assert len(dirs)==1,dirs
          with open(os.environ["GITHUB_ENV"],"a") as f:f.write(f"ASSET_OUTPUT={dirs[0]}\n")
          PY
      - name: Validate actual GLB and compare four renders with baseline
        if: steps.deadline.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          python3 scripts/production_asset_qa.py --asset "$ASSET" --task-id "$TASK_ID" --output "$ASSET_OUTPUT" --source '${{ github.sha }}'
      - name: Upload candidate and evidence even when objective QA fails
        if: always() && steps.deadline.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: genesis-auto-${{ github.run_id }}
          path: |
            output*/*.png
            output*/*.glb
            output*/*.blend
            output*/textures/*.png
            output*/*AUDIT*.json
            reports/production_auto/**
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve objective QA or rejection in isolated branch, never approve automatically
        if: always() && steps.deadline.outputs.run == 'true'
        run: |
          set -euo pipefail
          if [[ ! -d reports/production_auto ]]; then
            echo "QA did not produce a report; inspect build logs." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Publish only review-sized renders and QA; GLB stays in the workflow artifact.
          mkdir -p reports/production_auto previews/production_auto
          if [[ -n "${ASSET:-}" && -n "${TASK_ID:-}" && -d "${ASSET_OUTPUT:-/nonexistent}" ]]; then
            dest="previews/production_auto/${ASSET}_${TASK_ID}"
            mkdir -p "$dest"
            for view in front three_quarter rear detail; do
              if [[ -f "$ASSET_OUTPUT/$view.png" ]]; then
                cp "$ASSET_OUTPUT/$view.png" "$dest/$view.png"
              fi
            done
            for qa in reports/production_auto/*.json; do
              if [[ -f "$qa" ]]; then cp "$qa" "$dest/"; fi
            done
          fi
          git add -A -- reports/production_auto/ previews/production_auto/
          if ! git diff --cached --quiet; then
            git commit -m 'Record objective candidate QA; human artistic approval pending [skip ci]'
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
      - name: Dispatch fresh four-view art review after successful real build
        if: success() && steps.deadline.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # workflow_run may be suppressed for runs dispatched using GITHUB_TOKEN.
          # workflow_dispatch is explicitly allowed and ensures the new candidate
          # appears in latest.json/contact_sheet, not a stale inherited version.
          gh workflow run art-review-handoff.yml --repo "${{ github.repository }}" --ref main
