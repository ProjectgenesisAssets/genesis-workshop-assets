name: Genesis plaza V009 - oak composition, subtle root flares and denser small leaves
on:
  workflow_dispatch:
  push:
    branches: [feature/plaza-cuatro-arboles-playcanvas]
    paths:
      - scripts/roble_sapling_v009.py
      - .github/workflows/roble-sapling-v009.yml
permissions:
  contents: write
jobs:
  oak:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify V009 source syntax
        run: python3 -m py_compile scripts/roble_sapling_v009.py
      - name: Download official Blender 4.5.13 and Sapling source
        run: |
          set -euo pipefail
          curl -fSL --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz -o /tmp/blender-oak-v009.tar.xz
          mkdir -p /tmp/blender-oak-v009
          tar -xJf /tmp/blender-oak-v009.tar.xz -C /tmp/blender-oak-v009 --strip-components=1
          git clone --depth 1 --filter=blob:none --sparse https://github.com/blender/blender-addons.git /tmp/blender-addons
          git -C /tmp/blender-addons sparse-checkout set add_curve_sapling
          test -f /tmp/blender-addons/add_curve_sapling/utils.py
      - name: Create watertight oak V009 and full-size renders
        run: /tmp/blender-oak-v009/blender -b -t 2 --python-exit-code 1 --python scripts/roble_sapling_v009.py
      - name: Independently validate GLB, triangle budget and previews
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,struct,os
          d='output_plaza_v009/oak'
          audit=json.load(open(f'{d}/AUDIT.json'))
          with open(f'{d}/oak_sapling_v009.glb','rb') as f:
              assert f.read(4)==b'glTF'
              f.read(8)
              n=struct.unpack('<I',f.read(4))[0]
              assert f.read(4)==b'JSON'
              gltf=json.loads(f.read(n))
          tri=sum(gltf['accessors'][p['indices']]['count']//3 for m in gltf['meshes'] for p in m['primitives'])
          assert tri==audit['triangles'] and 0<tri<=60000,(tri,audit)
          assert 'MASK' in [m.get('alphaMode','OPAQUE') for m in gltf.get('materials',[])], 'FOLIAGE_ALPHA_MISSING'
          for name in ('front.png','three_quarter.png','side.png','skeleton_three_quarter.png','oak_leaf_atlas.png','oak_bark_albedo.png','oak_sapling_v009.blend'):
              assert os.path.getsize(f'{d}/{name}')>15000,name
          assert audit['approved'] is False
          print('V009 VERIFIED',json.dumps(audit,indent=2))
          PY
      - name: Publish verified render and PlayCanvas GLB permanently to org branch
        run: |
          set -euo pipefail
          mkdir -p previews/plaza_trees_v009/oak
          mkdir -p assets/plaza_trees_v009/oak
          cp output_plaza_v009/oak/front.png output_plaza_v009/oak/three_quarter.png output_plaza_v009/oak/side.png output_plaza_v009/oak/skeleton_three_quarter.png output_plaza_v009/oak/AUDIT.json previews/plaza_trees_v009/oak/
          cp output_plaza_v009/oak/oak_sapling_v009.glb assets/plaza_trees_v009/oak/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/plaza_trees_v009/oak assets/plaza_trees_v009/oak
          git diff --cached --quiet || git commit -m 'Publish V009 candidate oak, audit, GLB and visual comparison [skip ci]'
          git pull --rebase origin feature/plaza-cuatro-arboles-playcanvas
          git push origin HEAD:feature/plaza-cuatro-arboles-playcanvas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genesis-plaza-v009-oak-source-and-renders
          path: output_plaza_v009/oak/
          retention-days: 7
          if-no-files-found: warn
