name: Genesis plaza - V011 true-color 24fps water animation in Blender Cycles
on:
  push:
    branches:
      - feature/plaza-fuente-delfin-marmol-aaa
    paths:
      - scripts/plaza_fuente_delfin_marmol_v011_animation_hq.py
      - .github/workflows/plaza-fuente-delfin-v011-animation-hq.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: genesis-plaza-dolphin-fountain-v011-animation-hq-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GENESIS_TEX_SIZE: "4096"
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Validate Blender generator syntax
        run: python3 -m py_compile scripts/plaza_fuente_delfin_marmol_v011_animation_hq.py
      - name: Install official Blender 4.5.13 LTS (GitHub Actions only)
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 \
            https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz \
            -o /tmp/blender-4.5.13.tar.xz
          mkdir -p /tmp/genesis-blender
          tar -xJf /tmp/blender-4.5.13.tar.xz -C /tmp/genesis-blender --strip-components=1
          /tmp/genesis-blender/blender --version | grep -F "Blender 4.5.13"
      - name: Download verified public-domain anatomical dolphin (CC0)
        run: |
          set -euo pipefail
          mkdir -p inputs
          curl --fail --location --retry 3 --connect-timeout 20 \
            'https://www.innerscene.com/api/library/common-bottlenose-dolphin-a7f74d0e/download' \
            -o inputs/common-bottlenose-dolphin.glb
          python3 - <<'PY'
          import pathlib,struct,hashlib
          path=pathlib.Path("inputs/common-bottlenose-dolphin.glb")
          b=path.read_bytes()
          assert len(b)>100000 and b[:4]==b"glTF"
          assert struct.unpack_from("<I",b,4)[0]==2
          assert struct.unpack_from("<I",b,8)[0]==len(b)
          print("CC0_SOURCE_SHA256",hashlib.sha256(b).hexdigest())
          PY
      - name: Download real 4K scanned marble PBR (Poly Haven CC0 / Amal Kumar)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, pathlib, json, hashlib, urllib.parse, shutil
          agent={"User-Agent":"ProjectGenesisAssets-FountainPBR/0.4 (public open source production)"}
          request=urllib.request.Request("https://api.polyhaven.com/files/marble_rock_01",headers=agent)
          with urllib.request.urlopen(request,timeout=45) as response:
              files=json.load(response)
          target=pathlib.Path("inputs/marble_rock_01")
          target.mkdir(parents=True,exist_ok=True)
          wanted={"Diffuse":("jpg","marble_albedo_4k.jpg"),
                  "Rough":("jpg","marble_roughness_4k.jpg"),
                  "nor_gl":("png","marble_normal_4k.png"),
                  "Displacement":("png","marble_height_4k.png")}
          manifest={"source":"https://polyhaven.com/a/marble_rock_01",
                    "author":"Amal Kumar","license":"CC0","resolution":"4k","files":{}}
          for channel,(fmt,filename) in wanted.items():
              info=files[channel]["4k"][fmt]
              link=info["url"]
              assert link.startswith("https://"),"Unsafe texture URL"
              assert urllib.parse.urlparse(link).hostname in ("dl.polyhaven.org","polyhaven.org","cdn.polyhaven.com"),"Unexpected texture host"
              dest=target/filename
              req=urllib.request.Request(link,headers=agent)
              with urllib.request.urlopen(req,timeout=120) as r, dest.open("wb") as out:
                  shutil.copyfileobj(r,out,length=1024*1024)
              assert dest.stat().st_size>100000,filename
              actual=hashlib.md5(dest.read_bytes()).hexdigest()
              assert actual==info["md5"],f"Texture checksum mismatch: {filename}"
              manifest["files"][channel]={"file":filename,"md5":actual,"size":dest.stat().st_size,"source":link}
              print("VERIFIED_POLYHAVEN_CC0_4K",channel,filename,dest.stat().st_size)
          (target/"SOURCE_MANIFEST.json").write_text(json.dumps(manifest,indent=2))
          PY
      - name: Render all 192 frames at 24 FPS as true-color PNG via Blender Cycles
        run: |
          set -euo pipefail
          /tmp/genesis-blender/blender -b -t 3 --python-exit-code 1 \
            --python scripts/plaza_fuente_delfin_marmol_v011_animation_hq.py
      - name: Encode visually loss-minimized H264 MP4 without indexed color
        run: |
          set -euo pipefail
          output=output_fountain_dolphin_v011
          count=$(find "$output/animated_frames_hq" -name 'dolphin_*.png' -type f | wc -l)
          test "$count" -eq 192
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          ffmpeg -hide_banner -loglevel error -y \
            -framerate 24 -pattern_type glob \
            -i "$output/animated_frames_hq/dolphin_*.png" \
            -c:v libx264 -profile:v high -preset slow -crf 12 \
            -pix_fmt yuv420p -r 24 -movflags +faststart \
            "$output/genesis_dolphin_fountain_water_v011_8s_HQ_24fps.mp4"
          ffprobe -v error -show_entries stream=codec_name,pix_fmt,width,height,nb_frames,avg_frame_rate:format=duration \
            -of json "$output/genesis_dolphin_fountain_water_v011_8s_HQ_24fps.mp4" \
            > "$output/FFPROBE_VIDEO_QA.json"
      - name: Verify output true-color PNG frames and MP4 duration codec and FPS
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,struct,pathlib,hashlib
          p=pathlib.Path('output_fountain_dolphin_v011')
          qa=json.loads((p/'ANIMATION_HQ_QA.json').read_text())
          meta=json.loads((p/'FFPROBE_VIDEO_QA.json').read_text())
          audit=json.loads((p/'AUDIT.json').read_text())
          st=meta['streams'][0]
          assert qa['render_fps']==24 and qa['frame_count_expected']==192
          assert qa['render_size']==[1280,960]
          assert qa['marble']=='UNCHANGED_V007_4K_CC0_PBR'
          assert audit['marble_change'].startswith('NONE')
          assert len(audit['stone_source_sha256'])==4
          assert st['codec_name']=='h264' and st['pix_fmt']=='yuv420p'
          assert (st['width'],st['height'])==(1280,960)
          assert st['avg_frame_rate']=='24/1',st
          assert int(st['nb_frames'])==192,st
          assert abs(float(meta['format']['duration'])-8)<.06
          frames=sorted((p/'animated_frames_hq').glob('dolphin_*.png'))
          assert len(frames)==192
          for frame in [frames[0],frames[64],frames[-1]]:
              raw=frame.read_bytes()
              assert raw[:8]==b'\x89PNG\r\n\x1a\n'
              width,height,depth,color=struct.unpack_from('>IIBB',raw,16)
              assert (width,height,depth,color)==(1280,960,8,2)
              print("VERIFIED_TRUE_COLOR_FRAME",frame.name,len(raw))
          video=p/'genesis_dolphin_fountain_water_v011_8s_HQ_24fps.mp4'
          assert video.stat().st_size>200000
          print("VERIFIED_H264_24FPS_192FRAMES_8SECONDS",video.stat().st_size,hashlib.sha256(video.read_bytes()).hexdigest())
          PY
      - name: Upload full-color MP4 and quality audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genesis-v011-realwater-8s-hq-24fps-${{ github.run_id }}
          path: |
            output_fountain_dolphin_v011/genesis_dolphin_fountain_water_v011_8s_HQ_24fps.mp4
            output_fountain_dolphin_v011/FFPROBE_VIDEO_QA.json
            output_fountain_dolphin_v011/ANIMATION_HQ_QA.json
            output_fountain_dolphin_v011/AUDIT.json
          retention-days: 7
          if-no-files-found: warn
      - name: Publish verified full-color MP4 in fountain review branch
        if: success()
        run: |
          set -euo pipefail
          mkdir -p previews/plaza_fuente_delfin_v011
          cp output_fountain_dolphin_v011/genesis_dolphin_fountain_water_v011_8s_HQ_24fps.mp4 previews/plaza_fuente_delfin_v011/
          cp output_fountain_dolphin_v011/FFPROBE_VIDEO_QA.json previews/plaza_fuente_delfin_v011/
          cp output_fountain_dolphin_v011/ANIMATION_HQ_QA.json previews/plaza_fuente_delfin_v011/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/plaza_fuente_delfin_v011
          if ! git diff --cached --quiet; then
            git commit -m 'Publish V011 true-color 8s water MP4 24fps [skip ci]'
            git fetch origin feature/plaza-fuente-delfin-marmol-aaa
            git rebase origin/feature/plaza-fuente-delfin-marmol-aaa
            git push origin HEAD:feature/plaza-fuente-delfin-marmol-aaa
          fi
