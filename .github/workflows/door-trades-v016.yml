name: Genesis workshop doors V016 - wood and leather surface quality
on:
  push:
    branches:
      - production/door-v016-five-workshop-materials
    paths:
      - scripts/puertas_talleres_variantes_v016.py
      - .github/workflows/door-trades-v016.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: genesis-door-v016-trades-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        trade: [carpintero, curtidor]
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      PG_DOOR_TRADE: ${{ matrix.trade }}
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and existing approved silhouette
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/puertas_talleres_variantes_v016.py
          test -s previews/door_v014/front.png
          test -s previews/door_v011/front.png
      - name: Install Blender 4.5.13 official binary
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 240 https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz -o /tmp/door-v016-blender.tar.xz
          mkdir -p /tmp/door-v016-blender
          tar -xJf /tmp/door-v016-blender.tar.xz -C /tmp/door-v016-blender --strip-components=1
          /tmp/door-v016-blender/blender --version | grep -F 'Blender 4.5.13'
      - name: Render 4 real Cycles views plus 16 PBR maps and GLB
        run: |
          set -euo pipefail
          /tmp/door-v016-blender/blender -b -t 3 --python-exit-code 1 --python scripts/puertas_talleres_variantes_v016.py
      - name: Verify geometry lock, outputs and physically coherent PBR maps
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          import os,json,struct
          from PIL import Image, ImageChops
          trade=os.environ["PG_DOOR_TRADE"]
          p=Path("output_workshop_door_v016_"+trade)
          audit=json.loads((p/"DESIGN_AUDIT.json").read_text())
          report=json.loads((p/"V016_MATERIAL_TEST.json").read_text())
          assert report["version"]=="V016" and report["profession"]==trade
          assert report["geometry_baseline"]=="V011_USER_APPROVED" and report["material_only"]
          assert report["exact_V175_material_applied"] is False
          assert 10000<audit["evaluated_triangles"]<68028,audit
          assert (p/("Workshop_Door_V016_"+trade+".blend")).stat().st_size>10000
          glb=p/("Workshop_Door_V016_"+trade+".glb")
          with glb.open("rb") as f: magic,version,length=struct.unpack("<III",f.read(12))
          assert (magic,version,length)==(0x46546c67,2,glb.stat().st_size)
          maps=[x for t in ("albedo","roughness","normal","metallic") for x in p.glob("*_"+t+".png")]
          assert len(maps)==16,[m.name for m in maps]
          for m in maps:
              with Image.open(m) as im: assert im.size==(1536,1536),m
          for name,out_name in [("front","front_orthographic"),("three_quarter","three_quarter"),("rear","rear_orthographic"),("side","side_orthographic")]:
              with Image.open("previews/door_v014/"+name+".png") as ref,Image.open(p/(out_name+".png")) as cand:
                  assert ref.size==cand.size,(name,ref.size,cand.size)
                  a=ref.getchannel("A").point(lambda v:255 if v>127 else 0)
                  b=cand.getchannel("A").point(lambda v:255 if v>127 else 0)
                  u=ImageChops.lighter(a,b);i=ImageChops.darker(a,b)
                  iou=sum(i.histogram()[128:])/max(1,sum(u.histogram()[128:]))
                  print("PROFESSION",trade,"APPROVED_SILHOUETTE",name,round(iou,6))
                  assert iou>=.995,(trade,name,iou)
          print("PBR_VARIANT_REVIEW_READY",trade,glb.stat().st_size)
          PY
      - name: Upload original 3D+PBR+render artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: door-v016-${{ matrix.trade }}
          path: |
            output_workshop_door_v016_${{ matrix.trade }}/*.png
            output_workshop_door_v016_${{ matrix.trade }}/*.glb
            output_workshop_door_v016_${{ matrix.trade }}/*.json
            output_workshop_door_v016_${{ matrix.trade }}/*.blend
          retention-days: 7
          if-no-files-found: warn
  gallery:
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: door-v016-*
          path: evidence
      - name: Replace two rejected finishes in the five-door true-render sheet
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          root=Path("previews")
          prev=Image.open(root/"door_v015_profiles"/"five_workshops_all_views.jpg").convert("RGB")
          assert prev.size==(1850,2072),prev.size
          prevfront=Image.open(root/"door_v015_profiles"/"five_workshops_front.jpg").convert("RGB")
          out=root/"door_v016_profiles";out.mkdir(exist_ok=True)
          views={"front":"front_orthographic","three_quarter":"three_quarter",
                 "rear":"rear_orthographic","side":"side_orthographic"}
          cell=(370,518)
          collage=prev.copy()
          front=prevfront.copy()
          draw=ImageDraw.Draw(collage);fdraw=ImageDraw.Draw(front)
          before_after=Image.new("RGB",(cell[0]*4,cell[1]),(25,28,31))
          for idx,trade in enumerate(("carpintero","curtidor")):
              col=idx+1
              label=trade.title()
              for row,(view,outname) in enumerate(views.items()):
                  src=Path("evidence")/("door-v016-"+trade)/(outname+".png")
                  assert src.stat().st_size>10000,src
                  with Image.open(src) as im:
                      im=im.convert("RGBA")
                      im.thumbnail((344,460),Image.Resampling.LANCZOS)
                      tile=Image.new("RGBA",cell,(43,46,50,255))
                      tile.alpha_composite(im,((cell[0]-im.width)//2,12+(460-im.height)//2))
                  x=col*cell[0];y=row*cell[1]
                  collage.paste(tile.convert("RGB"),(x,y))
                  draw.text((x+17,y+478),label+" V016 - "+view,fill=(244,236,213))
                  if view=="front":
                      front.paste(tile.convert("RGB"),(x,0))
                      fdraw.text((x+17,478),label+" V016",fill=(244,236,213))
                  if view=="three_quarter":
                      # Store compact actual Blender camera view, plus old-vs-new comparison.
                      tile.convert("RGB").save(out/(trade+"_hero_v016.jpg"),quality=89,optimize=True)
                      before=Image.open(root/"door_v015_profiles"/(trade+"_hero.jpg")).convert("RGB")
                      assert before.size==cell,(trade,before.size)
                      cidx=idx*2
                      before_after.paste(before,(cidx*cell[0],0))
                      before_after.paste(tile.convert("RGB"),((cidx+1)*cell[0],0))
          collage.save(out/"five_workshops_all_views_v016.jpg",quality=84,optimize=True)
          front.save(out/"five_workshops_front_v016.jpg",quality=89,optimize=True)
          bd=ImageDraw.Draw(before_after)
          for k,lbl in enumerate(("Carpintero antes","Carpintero ahora","Curtidor antes","Curtidor ahora")):
              bd.rectangle((k*cell[0],0,k*cell[0]+cell[0]-1,23),fill=(25,28,31))
              bd.text((k*cell[0]+16,7),lbl,fill=(250,240,216))
          before_after.save(out/"carpintero_curtidor_before_after.jpg",quality=88,optimize=True)
          print("V016_PHOTOREAL_REVIEWS",[(p.name,p.stat().st_size) for p in out.glob("*.jpg")])
          PY
      - name: Publish candidate JPGs without overwriting old versions
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/door_v016_profiles
          if ! git diff --cached --quiet; then
            git commit -m 'Review V016 timber joints and recessed leather vs V015 [skip ci]'
            git fetch origin production/door-v016-material-depth-carpenter-tanner
            git rebase origin/production/door-v016-material-depth-carpenter-tanner
            git push origin HEAD:production/door-v016-material-depth-carpenter-tanner
          fi
