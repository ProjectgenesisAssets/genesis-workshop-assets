name: Test public Meshy merchant GLB export

on:
  push:
    branches:
      - experiment/meshy-merchant-download-20261102

permissions:
  contents: read

jobs:
  try-merchant:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare runtime
        run: |
          python --version
          node --version
          python -m pip --version
          mkdir -p output
      - name: Install open-source downloader
        run: |
          python -m pip install --user "git+https://github.com/Shuvam-Banerji-Seal/meshy-glb-downloader.git"
      - name: Test the exact public Meshy post
        id: attempt
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m meshy_glb "https://www.meshy.ai/es/posts/0194fd29-73ec-776b-9767-835d64751522" -o output/merchant.glb -v 2>&1 | tee output/attempt-log.txt
      - name: Inspect public Meshy post metadata
        if: always()
        shell: bash
        run: |
          python - <<'PY' 2>&1 | tee output/public-post-diagnostics.txt
          import urllib.request,urllib.error,re,html,json
          uid="0194fd29-73ec-776b-9767-835d64751522"
          urls=[
            f"https://www.meshy.ai/es/posts/{uid}",
            f"https://www.meshy.ai/posts/{uid}",
            f"https://www.meshy.ai/meshyd-api/web/public/v2/posts/{uid}",
            f"https://www.meshy.ai/meshyd-api/web/public/v1/posts/{uid}",
          ]
          headers={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36","Accept":"text/html,application/json"}
          pat=re.compile(r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}",re.I)
          all_ids={}
          for url in urls:
              print("CHECK",url,flush=True)
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=25) as response:
                      raw=response.read(4_000_000)
                      data=raw.decode("utf-8","replace")
                      print("STATUS",response.status,"SIZE",len(raw),"TYPE",response.headers.get("Content-Type"),"FINAL",response.url)
                      title=re.search(r"<title[^>]*>(.*?)</title>",data,re.I|re.S)
                      if title: print("TITLE",html.unescape(title.group(1))[:250])
                      matches=list(pat.finditer(data))
                      print("UUID_OCCURRENCES",len(matches))
                      for m in matches:
                          if m.group().lower()==uid: continue
                          context=data[max(0,m.start()-95):min(len(data),m.end()+95)].replace("\\","").replace("\\n"," ")[:230]
                          all_ids.setdefault(m.group().lower(),context)
                      for marker in ["modelUrl","taskId","model.meshy","3d-models","generationId"]:
                          j=data.find(marker)
                          if j>=0: print("MARKER",marker,data[max(0,j-100):j+240].replace("\\n"," ")[:340])
              except Exception as exc: print("ERROR",type(exc).__name__,str(exc)[:300])
          print("OTHER_UUIDS",json.dumps(dict(list(all_ids.items())[:25]),ensure_ascii=False,indent=2))
          with open("output/candidate-task-ids.json","w") as f:json.dump(all_ids,f,indent=2)
          PY
      - name: Inspect public 3D viewer through headless Chrome
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m pip install --user playwright
          python -m playwright install chromium
          python - <<'PY' 2>&1 | tee output/browser-diagnostics.txt
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          from urllib.parse import urlparse
          from collections import Counter
          import re,json,traceback
          target="https://www.meshy.ai/es/posts/0194fd29-73ec-776b-9767-835d64751522"
          captures=[]
          candidate_files=[]
          def response_handler(response):
              url=response.url
              path=urlparse(url).path
              lower=path.lower()
              if "/meshyd-api/" in lower and any(x in lower for x in ("posts","task","model")):
                  entry={"type":"api","status":response.status,"path":path}
                  captures.append(entry)
                  print("API",response.status,path,flush=True)
                  if "json" in response.headers.get("content-type",""):
                      try:
                          data=response.text()
                          for mark in ["modelUrl","taskId","model.meshy"]:
                              i=data.find(mark)
                              if i>=0: print("JSON_MARKER",mark,data[max(0,i-80):i+180][:260],flush=True)
                      except Exception as e: print("API_READ_ERROR",str(e)[:180])
              if lower.endswith((".meshy",".glb")) or "/model.meshy" in lower:
                  print("MODEL_RESPONSE",response.status,path,flush=True)
                  if response.status!=200:return
                  try:
                      data=response.body()
                      print("MODEL_BYTES",len(data),data[:8],flush=True)
                      if len(data)>1000 and data[:8] in (b"MESHY.AI",b"glTF"):
                          p=Path("output/browser-captured"+(".glb" if data[:4]==b"glTF" else ".meshy"))
                          p.write_bytes(data)
                          candidate_files.append(str(p))
                  except Exception as e: print("MODEL_READ_ERROR",str(e)[:180],flush=True)
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--no-sandbox","--use-gl=angle","--use-angle=swiftshader","--enable-webgl"])
              page=browser.new_page(viewport={"width":1440,"height":900})
              page.on("response",response_handler)
              try:
                  res=page.goto(target,wait_until="domcontentloaded",timeout=35000)
                  print("PAGE_STATUS",res.status if res else None,flush=True)
                  page.wait_for_timeout(18000)
                  print("PAGE_TITLE",page.title(),"CANVAS",page.locator("canvas").count(),flush=True)
                  html=page.content()
                  uid="0194fd29-73ec-776b-9767-835d64751522"
                  for m in list(re.finditer(uid,html))[:4]:
                      print("POST_CONTEXT",html[max(0,m.start()-400):m.end()+600].replace("\\n"," ")[:1100],flush=True)
              except Exception as e:print("BROWSER_ERROR",type(e).__name__,str(e)[:500],flush=True)
              finally:browser.close()
          Path("output/browser-requests.json").write_text(json.dumps(captures,indent=2),encoding="utf-8")
          file=Path("output/browser-captured.meshy")
          if file.is_file():
              try:
                  from meshy_glb.core import ensure_loader,decrypt_meshy,validate_glb
                  js,wasm=ensure_loader()
                  decrypt_meshy(str(file),"output/merchant.glb",js,wasm)
                  print("DECRYPTED_GLB",json.dumps(validate_glb("output/merchant.glb")),flush=True)
              except Exception as e:print("DECRYPT_ERROR",type(e).__name__,str(e)[:500],flush=True)
              finally:file.unlink(missing_ok=True)
          if Path("output/browser-captured.glb").is_file():
              Path("output/browser-captured.glb").replace("output/merchant.glb")
              print("DIRECT_GLB_CAPTURED",flush=True)
          print("CAPTURE_COUNT",len(captures),"MODEL_FILES",len(candidate_files),flush=True)
          PY
      - name: Validate result and write diagnostics
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,struct
          f=Path("output/merchant.glb")
          result={"url":"https://www.meshy.ai/es/posts/0194fd29-73ec-776b-9767-835d64751522","model_present":f.is_file()}
          if f.is_file():
              size=f.stat().st_size
              with f.open("rb") as stream:
                  hdr=stream.read(20)
                  if len(hdr)==20:
                      magic,version,declared,json_len,json_type=struct.unpack("<4sIIII",hdr)
                      result.update({"bytes":size,"valid_header":magic==b"glTF" and version==2 and declared==size and json_type==0x4e4f534a})
                      if result["valid_header"]:
                          doc=json.loads(stream.read(json_len).decode("utf-8"))
                          result.update({k:len(doc.get(k,[])) for k in ("meshes","materials","textures","images","animations","skins")})
                          result["generator"]=doc.get("asset",{}).get("generator")
          Path("output/report.json").write_text(json.dumps(result,indent=2), encoding="utf-8")
          print(json.dumps(result,indent=2))
          PY
      - name: Upload GLB and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meshy-merchant-download-test
          path: output/
          if-no-files-found: error
          retention-days: 7
