name: Genesis | publish actual V019 linen cut macro from verified artifact
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-linen-v019-macro.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  macro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: asset/linen-thread
      - uses: actions/download-artifact@v4
        with:
          run-id: 41336012488
          name: genesis-linen-thread-41336012488
          github-token: ${{ github.token }}
          repository: ProjectgenesisAssets/genesis-workshop-assets
          path: /tmp/genesis-v019-artifact
      - name: Extract true Blender cut macro without rerendering asset
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          source=list(Path("/tmp/genesis-v019-artifact").rglob("cut_detail.png"))
          if len(source)!=1:raise RuntimeError("Expected authentic cut_detail.png: "+str(len(source)))
          rgba=Image.open(source[0]).convert("RGBA")
          bg=Image.new("RGBA",rgba.size,(43,46,52,255))
          bg.alpha_composite(rgba)
          img=bg.convert("RGB")
          dst=Path("evaluation/linen-thread/v019/cut_detail.jpg")
          dst.parent.mkdir(parents=True,exist_ok=True)
          img.thumbnail((850,850),Image.Resampling.LANCZOS)
          img.save(dst,quality=93,optimize=True)
          print("Published original V019 macro:",dst)
          PY
      - name: Commit extracted image only on linen candidate branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluation/linen-thread/v019/cut_detail.jpg
          git commit -m "review: publish genuine V019 linen cut macro [skip ci]"
          git pull --rebase origin asset/linen-thread
          git push origin HEAD:asset/linen-thread
