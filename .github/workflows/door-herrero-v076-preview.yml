name: Herrero Door V076 - Diagnose six studio lights washing out authentic black iron
on:
  push:
    branches:
      - production/door-herrero
    paths:
      - scripts/puerta_herreria_art_076.py
      - .github/workflows/door-herrero-v076-preview.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Confirm original unpacked 4K PBR source stays unchanged
        run: |
          set -euo pipefail
          p=assets/door_herrero/materials/rusted_scratched_iron_4k
          for layer in color normalgl roughness metalness displacement; do
            test -s "$p/rusted-scratched-iron_4k_${layer}.jpg"
          done
          test -s "$p/LICENSE.txt"
      - name: Install Blender 4.5.13 LTS
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 300 https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz -o /tmp/blender.tar.xz
          mkdir -p /tmp/blender
          tar -xJf /tmp/blender.tar.xz -C /tmp/blender --strip-components=1
          /tmp/blender/blender --version | grep -F 'Blender 4.5.13'
      - name: Download neutral studio HDRI
        run: |
          curl -fsSL --retry 4 --max-time 300 https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_09_1k.hdr -o studio_small_09_1k.hdr
          test -s studio_small_09_1k.hdr
      - name: Validate Python scene code before expensive Blender render
        run: |
          python3 -m py_compile scripts/puerta_herreria_art_076.py
      - name: Blender V076 render unchanged V075 iron with original versus 25/40% studio intensity
        env:
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
        run: |
          /tmp/blender/blender -b -t 3 --python-exit-code 1 --python scripts/puerta_herreria_art_076.py
      - name: Verify rendered comparisons
        run: |
          set -euo pipefail
          for variant in A_v075B_overlit_reference B_same_iron_25pct_studio C_same_iron_40pct_studio D_25pct_studio_iron_closeup; do
            test -s "output_blacksmith_door_art_076/${variant}.png"
          done
          test -s output_blacksmith_door_art_076/DESIGN_AUDIT.json
          test -s output_blacksmith_door_art_076/V076_PBR_QA.json
          test -s output_blacksmith_door_art_076/V076_METAL_VS_LEATHER_QA.json
          test -s output_blacksmith_door_art_076/V076_STUDIO_EXPOSURE_QA.json
          for map in V076_normal_opengl V076_B_blackened_forged_iron_albedo V076_B_blackened_forged_iron_metalness V076_B_blackened_forged_iron_roughness V076_C_warm_tempered_forged_iron_albedo V076_C_warm_tempered_forged_iron_metalness V076_C_warm_tempered_forged_iron_roughness; do
            test -s "output_blacksmith_door_art_076/${map}.png"
          done
          sha256sum output_blacksmith_door_art_076/{A_v075B_overlit_reference,B_same_iron_25pct_studio,C_same_iron_40pct_studio,D_25pct_studio_iron_closeup}.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blacksmith-door-v076-illumination-audit
          path: |
            output_blacksmith_door_art_076/*.png
            output_blacksmith_door_art_076/*.json
          retention-days: 7
      - name: Publish preview renders
        if: success()
        run: |
          set -euo pipefail
          mkdir -p previews/door_herrero_v076
          for variant in A_v075B_overlit_reference B_same_iron_25pct_studio C_same_iron_40pct_studio D_25pct_studio_iron_closeup; do
            cp "output_blacksmith_door_art_076/${variant}.png" "previews/door_herrero_v076/${variant}.png"
          done
          cp output_blacksmith_door_art_076/B_same_iron_25pct_studio.png previews/door_herrero_v076/three_quarter.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/door_herrero_v076
          if ! git diff --cached --quiet; then
            git commit -m 'Publish V076 physically oxidized forged iron previews [skip ci]'
            git pull --rebase origin production/door-herrero
            git push origin HEAD:production/door-herrero
          fi
