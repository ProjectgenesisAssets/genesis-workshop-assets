name: Genesis Anuario - Playwright Live Capture
on:
  push:
    branches: [experiment/anuario-playwright-capture-20261116]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Install Playwright + Chromium
        run: |
          python3 -m pip install -q --break-system-packages playwright
          python3 -m playwright install --with-deps chromium
      - name: Capture published game (real browser)
        shell: bash
        run: |
          mkdir -p captures
          cat >/tmp/genesis_capture.py <<'PY'
          from pathlib import Path
          import json, traceback
          from playwright.sync_api import sync_playwright
          output=Path("captures")
          output.mkdir(exist_ok=True)
          report={}
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--use-gl=angle","--use-angle=swiftshader","--enable-webgl","--disable-dev-shm-usage","--no-sandbox"])
              for key,url in [("main","https://gburdesedev.github.io/Project-genesis/"),("backup","https://gburdesedev.github.io/Project-genesis-backup/")]:
                  ctx=browser.new_context(viewport={"width":1920,"height":1080},device_scale_factor=1.5,ignore_https_errors=True)
                  page=ctx.new_page()
                  page.set_default_timeout(3000)
                  d={"url":url,"shots":[],"errors":[]}
                  report[key]=d
                  page.on("pageerror",lambda e: d["errors"].append(str(e)[:400]))
                  page.on("requestfailed",lambda r: d["errors"].append("request: "+r.url[:300]))
                  def take(stage):
                      name=key+"_"+stage+".png"
                      page.screenshot(path=str(output/name),timeout=30000,animations="disabled")
                      buttons=page.locator("button").evaluate_all("bs=>bs.map(b=>b.innerText.slice(0,100)).filter(Boolean).slice(0,50)")
                      d["shots"].append({"stage":stage,"image":name,"title":page.title(),"buttons":buttons})
                  try:
                      page.goto(url,wait_until="domcontentloaded",timeout=60000)
                      page.wait_for_timeout(7000)
                      take("inicio_7s")
                      page.wait_for_timeout(20000)
                      take("inicio_27s")
                      for label in ["Comenzar","Continuar","Jugar","Iniciar","Saltar","Herrero","Preparación","Fabricación","Inventario","Comparación","Resultado","Mercenario"]:
                          try:
                              loc=page.get_by_text(label,exact=True)
                              if loc.count() and loc.first.is_visible() and loc.first.is_enabled():
                                  loc.first.click(timeout=3000)
                                  page.wait_for_timeout(2000)
                                  take("click_"+str(len(d["shots"]))+"_"+str(len(label)))
                          except Exception as e:
                              d["errors"].append("click "+label+": "+str(e)[:100])
                      take("final")
                  except Exception as e:
                      d["errors"].append(traceback.format_exc()[-1200:])
                      try:take("error")
                      except Exception:pass
                  ctx.close()
              browser.close()
          (output/"diagnostico.json").write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps({k:{"shots":len(v["shots"]),"errors":len(v["errors"])} for k,v in report.items()}))
          PY
          python3 /tmp/genesis_capture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genesis-anuario-live-playwright-v01
          path: captures/
          if-no-files-found: warn
          retention-days: 7
