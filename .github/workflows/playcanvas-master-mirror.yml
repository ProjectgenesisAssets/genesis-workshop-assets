name: PlayCanvas master asset mirror
on:
  push:
    branches:
      - feature/playcanvas-master-20261103
    paths:
      - playcanvas-runtime/manifest.json
      - playcanvas-runtime/mirror.py
      - .github/workflows/playcanvas-master-mirror.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download original runtime models with textures
        run: python playcanvas-runtime/mirror.py --manifest playcanvas-runtime/manifest.json --root public/playcanvas-runtime/externals --lock playcanvas-runtime/lock.json
      - name: Commit verified local copies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/playcanvas-runtime/externals playcanvas-runtime/lock.json
          if ! git diff --cached --quiet; then
            git commit -m "assets: mirror verified PlayCanvas runtime models and dependencies"
            git push
          fi
