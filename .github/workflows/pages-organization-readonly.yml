name: Genesis organization Pages publication read-only diagnostic
on:
  push:
    branches:
      - integration/resultado-ora-v016001-20261109
    paths:
      - '.github/workflows/pages-organization-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect both public organization Pages states
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for repo in ProjectgenesisAssets/genesis-workshop-assets ProjectGenesisAssets2/genesis-equipment-assets; do
            echo "PAGES_STATUS_REPO=$repo"
            curl -sSL -w '\nHTTP_CODE=%{http_code}\n' --max-time 20 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$repo/pages" | head -c 2500
            echo
          done
