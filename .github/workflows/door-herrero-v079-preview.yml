name: Herrero Door V079 - Material-only black forge-scale and shallow forging marks
on:
  push:
    branches:
      - production/door-herrero-v079-forge-scale
    paths:
      - scripts/puerta_herreria_art_079.py
      - .github/workflows/door-herrero-v079-preview.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Confirm original unpacked 4K PBR source stays unchanged
        run: |
          set -euo pipefail
          p=assets/door_herrero/materials/rusted_scratched_iron_4k
          for layer in color normalgl roughness metalness displacement; do
            test -s "$p/rusted-scratched-iron_4k_${layer}.jpg"
          done
          test -s "$p/LICENSE.txt"
      - name: Install Blender 4.5.13 LTS
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 300 https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz -o /tmp/blender.tar.xz
          mkdir -p /tmp/blender
          tar -xJf /tmp/blender.tar.xz -C /tmp/blender --strip-components=1
          /tmp/blender/blender --version | grep -F 'Blender 4.5.13'
      - name: Download neutral studio HDRI
        run: |
          curl -fsSL --retry 4 --max-time 300 https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_09_1k.hdr -o studio_small_09_1k.hdr
          test -s studio_small_09_1k.hdr
      - name: Validate Python scene code before expensive Blender render
        run: |
          python3 -m py_compile scripts/puerta_herreria_art_079.py
      - name: Blender V079 art review - black forge-scale, restrained metallic glints and real PBR channels
        env:
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
        run: |
          /tmp/blender/blender -b -t 3 --python-exit-code 1 --python scripts/puerta_herreria_art_079.py
      - name: Verify rendered comparisons
        run: |
          set -euo pipefail
          for variant in A_blackened_iron_40pct_studio B_warm_blackened_iron_40pct_studio C_blackened_iron_25pct_studio D_blackened_iron_closeup_40pct; do
            test -s "output_blacksmith_door_art_079/${variant}.png"
          done
          test -s output_blacksmith_door_art_079/DESIGN_AUDIT.json
          test -s output_blacksmith_door_art_079/V079_PBR_QA.json
          test -s output_blacksmith_door_art_079/V079_METAL_VS_LEATHER_QA.json
          test -s output_blacksmith_door_art_079/V079_VISUAL_QA.json
          for map in V079_normal_opengl V079_B_blackened_forged_iron_albedo V079_B_blackened_forged_iron_metalness V079_B_blackened_forged_iron_roughness V079_C_warm_tempered_forged_iron_albedo V079_C_warm_tempered_forged_iron_metalness V079_C_warm_tempered_forged_iron_roughness; do
            test -s "output_blacksmith_door_art_079/${map}.png"
          done
          sha256sum output_blacksmith_door_art_079/{A_blackened_iron_40pct_studio,B_warm_blackened_iron_40pct_studio,C_blackened_iron_25pct_studio,D_blackened_iron_closeup_40pct}.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blacksmith-door-v079-black-oxide-scale-art-candidate
          path: |
            output_blacksmith_door_art_079/*.png
            output_blacksmith_door_art_079/*.json
          retention-days: 7
      - name: Publish preview renders
        if: success()
        run: |
          set -euo pipefail
          mkdir -p previews/door_herrero_v079
          for variant in A_blackened_iron_40pct_studio B_warm_blackened_iron_40pct_studio C_blackened_iron_25pct_studio D_blackened_iron_closeup_40pct; do
            cp "output_blacksmith_door_art_079/${variant}.png" "previews/door_herrero_v079/${variant}.png"
          done
          cp output_blacksmith_door_art_079/A_blackened_iron_40pct_studio.png previews/door_herrero_v079/three_quarter.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/door_herrero_v079
          if ! git diff --cached --quiet; then
            git commit -m 'Publish V079 physically oxidized forged iron previews [skip ci]'
            git pull --rebase origin production/door-herrero-v079-forge-scale
            git push origin HEAD:production/door-herrero-v079-forge-scale
          fi
