name: Genesis research CC0 photographic aged-wood PBR source
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/review-cc0-wood-source.yml'
permissions:
  contents: write
jobs:
  inspect-wood:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Read Poly Haven official CC0 asset API, acquire only 1K photograph
        run: |
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 - <<'PY'
          import json,urllib.request,base64,io
          from pathlib import Path
          from PIL import Image
          api='https://api.polyhaven.com/files/fine_grained_wood'
          req=urllib.request.Request(api,headers={'User-Agent':'ProjectGenesis-CC0-Texture-Review/1.0'})
          with urllib.request.urlopen(req,timeout=35) as r:
              data=json.load(r)
          print('Poly Haven channel keys:',list(data.keys()))
          key=next((k for k in data if k.lower() in ('diff','diffuse','albedo','basecolor')),None)
          assert key,key
          choices=data[key]
          print('Diffuse resolution choices:',list(choices.keys()))
          size=choices.get('1k') or choices.get('2k')
          assert size
          info=size.get('jpg') or size.get('png')
          assert info
          url=info['url']
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'ProjectGenesis-Texture-Review/1.0'}),timeout=90) as r:
              raw=r.read()
          assert len(raw)>10000
          pic=Image.open(io.BytesIO(raw)).convert('RGB')
          pic.thumbnail((1000,1000),Image.Resampling.LANCZOS)
          buf=io.BytesIO();pic.save(buf,format='JPEG',quality=81,optimize=True)
          out=Path('qa_lightbox/materials');out.mkdir(parents=True,exist_ok=True)
          (out/'fine_grained_oak_cc0.jpeg.b64').write_text(base64.b64encode(buf.getvalue()).decode('ascii'),encoding='ascii')
          receipt={'source':'https://polyhaven.com/a/fine_grained_wood','license':'CC0 1.0','credit':'Powered by Poly Haven','api':api,'selected_channel':key,'selected_file_url':url,'dimensions':[pic.width,pic.height],'original_bytes':len(raw)}
          (out/'fine_grained_oak_cc0.json').write_text(json.dumps(receipt,indent=2))
          print(receipt)
          PY
      - name: Publish only preview and provenance, not large source textures
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa_lightbox/materials/fine_grained_oak_cc0.*
          if ! git diff --cached --quiet; then
            git commit -m 'Audit CC0 photogrammetric wood texture - attribution and QA preview [skip ci]'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
