name: Publish Forge V003 real render review
on:
  push:
    branches:
      - 'production/forge-monolith-rock-v003'
    paths:
      - '.github/workflows/publish-forge-monolith-v003.yml'
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download completed Blender V003 artifact without rerender
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/stone-forge-v003
          gh run download 40677507790 --repo ProjectgenesisAssets/genesis-workshop-assets --name genesis-forge-monolith-v003 --dir /tmp/stone-forge-v003
          for shot in three_quarter front rear detail; do test -s "/tmp/stone-forge-v003/$shot.png"; done
      - name: Publish four real screenshots and objective audit on THIS isolated branch
        run: |
          set -euo pipefail
          mkdir -p previews/forge_monolith_v003
          for shot in three_quarter front rear detail; do cp "/tmp/stone-forge-v003/$shot.png" "previews/forge_monolith_v003/$shot.png"; done
          cp /tmp/stone-forge-v003/AUDIT.json previews/forge_monolith_v003/AUDIT.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/forge_monolith_v003
          git commit -m 'Publish real forge-only V003 four view QA [skip ci]'
          git push origin HEAD:production/forge-monolith-rock-v003
